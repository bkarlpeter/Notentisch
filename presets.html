<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board-Designs – Notentisch</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif;
               display: flex; justify-content: center; padding: 24px; min-height: 100vh; }
        .card { width: min(960px, 100%); background: #1b1b1b; border: 1px solid #2f2f2f;
                border-radius: 12px; padding: 20px; height: fit-content; }
        h1 { font-size: 20px; margin: 0; }
        .hint { color: #a0a0a0; font-size: 13px; margin: 4px 0 0; }

        /* ── Header ── */
        .page-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .page-header-text { flex: 1; }
        .page-header-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

        /* ── Buttons ── */
        button { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer;
                 font-weight: 700; font-size: 13px; background: #3498db; color: #fff; }
        button.secondary { background: #3a3a3a; }
        button.danger   { background: #c0392b; }
        button.success  { background: #27ae60; }
        button.active-on  { background: #27ae60; }
        button.active-off { background: #555; }
        button:disabled { opacity: 0.45; cursor: default; }

        /* ── Preset Grid ── */
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                       gap: 14px; margin-bottom: 20px; }
        .preset-card { border: 1px solid #2f2f2f; border-radius: 10px; overflow: hidden;
                       background: #171717; display: flex; flex-direction: column;
                       transition: opacity .2s; }
        .preset-card.inactive { opacity: 0.45; }
        .preset-card.is-current { border-color: #3498db; }

        /* Thumbnail */
        .preset-thumb { height: 108px; position: relative; overflow: hidden; flex-shrink: 0; }
        .preset-thumb-stage { width: 100%; height: 100%; padding: 13px; display: grid;
                              grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
                              gap: 6px; position: relative; }
        .preset-thumb-stage::after { content: ""; position: absolute; left: 50%; top: 50%;
            width: 42%; height: 56%; transform: translate(-50%, -50%); border-radius: 9px;
            background: var(--thumb-center, #d4b896); border: 3px solid var(--thumb-accent, #8b7355);
            box-shadow: 0 3px 10px rgba(0,0,0,.3); }
        .preset-thumb-q { background: var(--thumb-quadrant, #3d3428); border-radius: 5px; }
        .preset-current-badge { position: absolute; top: 6px; right: 6px; background: #3498db;
            color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
            z-index: 2; }

        /* Card body */
        .preset-card-body { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
        .preset-card-meta { display: flex; align-items: center; gap: 6px; }
        .preset-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px;
                        background: #2a2a2a; color: #888; }
        .preset-card-name { font-weight: 700; font-size: 14px; }
        .preset-card-desc { color: #a0a0a0; font-size: 12px; line-height: 1.35; flex: 1; }
        .preset-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .preset-card-actions button { flex: 1; padding: 6px 8px; font-size: 12px; min-width: 70px; }

        /* ── Add Form ── */
        .add-form { border: 1px solid #2f2f2f; border-radius: 10px; padding: 18px;
                    background: #151515; margin-bottom: 20px; }
        .add-form h2 { font-size: 15px; margin: 0 0 14px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field.span2 { grid-column: span 2; }
        @media (max-width: 600px) { .form-field.span2 { grid-column: span 1; } }
        .form-field label { font-size: 12px; font-weight: 600; color: #c8c8c8; }
        .form-field input[type="text"], .form-field select {
            width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #3a3a3a;
            background: #111; color: #fff; font-size: 13px; }
        .color-row { display: flex; align-items: center; gap: 8px; }
        input[type="color"] { width: 46px; height: 36px; border-radius: 6px;
                              border: 1px solid #3a3a3a; background: #111; padding: 2px; cursor: pointer; }
        .color-hex { width: 82px; padding: 8px; border-radius: 6px; border: 1px solid #3a3a3a;
                     background: #111; color: #fff; font-family: 'Courier New', monospace; font-size: 12px; }

        /* Live preview in form */
        .form-live-preview { display: flex; align-items: center; gap: 10px; }
        .form-preview-stage { width: 80px; height: 62px; border-radius: 7px; overflow: hidden;
                              flex-shrink: 0; position: relative; padding: 9px; display: grid;
                              grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; }
        .form-preview-stage::after { content: ""; position: absolute; left: 50%; top: 50%;
            width: 42%; height: 56%; transform: translate(-50%, -50%); border-radius: 7px;
            background: var(--fpv-center, #d4b896); border: 2px solid var(--fpv-accent, #8b7355); }
        .form-preview-q { background: var(--fpv-quadrant, #3d3428); border-radius: 3px; }
        .form-preview-note { font-size: 11px; color: #888; line-height: 1.35; }

        .form-actions { display: flex; gap: 8px; margin-top: 16px; }
        .hidden { display: none !important; }
        #status { font-size: 13px; color: #a9d8ff; min-height: 18px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <div class="page-header">
        <div class="page-header-text">
            <h1>Board-Designs verwalten</h1>
            <p class="hint">Werkstatt-Dateien können importiert werden. Importierte Designs starten in der Werkstatt und können später per Release freigegeben werden.</p>
        </div>
        <div class="page-header-actions">
            <button id="addBtn">+ Neues Design</button>
            <button id="backBtn" class="secondary">← Zurück zu Config</button>
        </div>
    </div>

    <!-- Add Form -->
    <div id="addForm" class="add-form hidden">
        <h2>Neues Design erstellen</h2>
        <div class="form-grid">
            <div class="form-field span2">
                <label for="newLabel">Name *</label>
                <input id="newLabel" type="text" placeholder="z.B. Japanisches Muster" maxlength="60">
            </div>
            <div class="form-field span2">
                <label for="newPattern">Muster-Datei (aus Werkstatt/)</label>
                <select id="newPattern">
                    <option value="">– kein Muster (Klassisch-Stil ohne Rahmen) –</option>
                </select>
            </div>
            <div class="form-field">
                <label>Board-Hintergrund</label>
                <div class="color-row">
                    <input type="color" id="newBoardColor" value="#121212">
                    <input type="text" class="color-hex" id="newBoardColorHex" value="#121212" maxlength="7">
                </div>
            </div>
            <div class="form-field">
                <label>Quadrant-Farbe</label>
                <div class="color-row">
                    <input type="color" id="newQuadrantColor" value="#3d3428">
                    <input type="text" class="color-hex" id="newQuadrantColorHex" value="#3d3428" maxlength="7">
                </div>
            </div>
            <div class="form-field">
                <label>Center-Fläche</label>
                <div class="color-row">
                    <input type="color" id="newCenterColor" value="#d4b896">
                    <input type="text" class="color-hex" id="newCenterColorHex" value="#d4b896" maxlength="7">
                </div>
            </div>
            <div class="form-field">
                <label>Akzent / Rahmenfarbe</label>
                <div class="color-row">
                    <input type="color" id="newAccentColor" value="#8b7355">
                    <input type="text" class="color-hex" id="newAccentColorHex" value="#8b7355" maxlength="7">
                </div>
            </div>
            <div class="form-field span2">
                <label>Vorschau</label>
                <div class="form-live-preview">
                    <div class="form-preview-stage" id="formPreviewStage">
                        <div class="form-preview-q"></div>
                        <div class="form-preview-q"></div>
                        <div class="form-preview-q"></div>
                        <div class="form-preview-q"></div>
                    </div>
                    <div class="form-preview-note" id="formPreviewNote">Farben und Muster wählen, um die Vorschau zu sehen.</div>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <button id="saveNewBtn" class="success">Speichern</button>
            <button id="cancelNewBtn" class="secondary">Abbrechen</button>
        </div>
    </div>

    <div id="importSection" class="add-form">
        <h2>Werkstatt-Import</h2>
        <div id="importGrid" class="preset-grid"></div>
    </div>

    <!-- Preset Grid -->
    <div id="presetGrid" class="preset-grid"></div>

    <div id="hiddenSection" class="add-form hidden">
        <h2>Ausgeblendete Designs</h2>
        <div id="hiddenGrid" class="preset-grid"></div>
    </div>

    <div id="status"></div>
</div>

<script src="board-presets.js?v=20260429c"></script>
<script>
    const WERKSTATT_DIR = 'Werkstatt/';
    const BUILTIN_PREVIEW_BY_ID = {
        'classic': {
            board: '#121212',
            quadrant: '#1f2e3a',
            center: '#1a3045',
            accent: '#5a9fd4',
            patternUrl: null
        },
        'carved-a': {
            board: '#17120d',
            quadrant: '#4d392b',
            center: '#f3e7d7',
            accent: '#9d7d59',
            patternUrl: 'Werkstatt/stock-photo-wooden-carved-pattern-with-a-large-flower-in-the-middle-with-intersecting-broken-lines-with-2259941291.jpg'
        },
        'carved-b': {
            board: '#16181b',
            quadrant: '#49525a',
            center: '#ece7df',
            accent: '#8e959c',
            patternUrl: 'Werkstatt/stock-photo-stone-marble-granite-slab-surface-for-decorative-works-or-texture-19417213.jpg'
        },
        'carved-c': {
            board: '#111611',
            quadrant: '#2a3b2d',
            center: '#e8e4d8',
            accent: '#b69b53',
            patternUrl: 'Werkstatt/stock-vector-japanese-or-chinese-seamless-pattern-with-luxury-green-and-gold-gradient-color-background-for-new-2405722885.jpg'
        }
    };
    let werkstattFiles = [];

    // ── Werkstatt discovery ──────────────────────────────────────────────────

    async function loadWerkstattFiles() {
        try {
            const res = await fetch(WERKSTATT_DIR, { cache: 'no-store' });
            if (!res.ok) return;
            const html = await res.text();
            const doc  = new DOMParser().parseFromString(html, 'text/html');
            werkstattFiles = [];
            doc.querySelectorAll('a[href]').forEach((a) => {
                const href = decodeURIComponent(a.getAttribute('href') || '');
                if (!href || href.endsWith('/')) return;
                const name = href.split('/').pop() || href;
                if (/\.(jpg|jpeg|png|webp)$/i.test(name)) {
                    werkstattFiles.push({ name, path: WERKSTATT_DIR + name });
                }
            });
        } catch {}
    }

    function populatePatternSelect() {
        const sel = document.getElementById('newPattern');
        while (sel.options.length > 1) sel.remove(1);
        werkstattFiles.forEach(({ name, path }) => {
            const opt = document.createElement('option');
            opt.value = path;
            opt.textContent = name;
            sel.appendChild(opt);
        });
    }

    // ── Helpers ──────────────────────────────────────────────────────────────

    function esc(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    function normalizeHex(value, fallback) {
        const s = String(value || '').trim();
        return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toLowerCase() : fallback;
    }

    function getPresetPreview(preset) {
        const fromPreset = preset?.preview || preset?.colors || {};
        const builtinFallback = preset?.builtin ? (BUILTIN_PREVIEW_BY_ID[String(preset.id || '')] || {}) : {};
        return {
            board: String(fromPreset.board || builtinFallback.board || '#121212'),
            quadrant: String(fromPreset.quadrant || builtinFallback.quadrant || '#3d3428'),
            center: String(fromPreset.center || builtinFallback.center || '#d4b896'),
            accent: String(fromPreset.accent || builtinFallback.accent || '#8b7355'),
            patternUrl: String(fromPreset.patternUrl || preset?.patternUrl || builtinFallback.patternUrl || '')
        };
    }

    function thumbBg(preview) {
        const url = String(preview?.patternUrl || '');
        if (url) {
            const safe = url.replace(/'/g, '%27');
            return `linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32)), url('${safe}') center/210px auto repeat`;
        }
        return String(preview?.board || '#121212');
    }

    function normalizePatternPath(pathValue) {
        return decodeURIComponent(String(pathValue || '').trim()).replace(/\\/g, '/');
    }

    function getImportedPatternPaths() {
        const all = typeof window.getAllBoardPresets === 'function' ? window.getAllBoardPresets() : [];
        const paths = new Set();
        all.forEach((preset) => {
            const preview = getPresetPreview(preset);
            const patternPath = normalizePatternPath(preview.patternUrl || preset?.patternUrl || '');
            if (patternPath) paths.add(patternPath);
        });
        return paths;
    }

    function buildLabelFromFileName(fileName) {
        return String(fileName || '')
            .replace(/\.[^.]+$/, '')
            .replace(/[_-]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim() || 'Neues Design';
    }

    // ── Color extraction from pattern image ──────────────────────────────────

    function extractDarkColorFromImage(imagePath) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const SIZE = 64;
                const canvas = document.createElement('canvas');
                canvas.width = SIZE; canvas.height = SIZE;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, SIZE, SIZE);
                let data;
                try { data = ctx.getImageData(0, 0, SIZE, SIZE).data; } catch { resolve(null); return; }
                const counts = {};
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    // Sehr helle (Hintergrund) und sehr dunkle Pixel überspringen
                    const brightness = (r + g + b) / 3;
                    if (brightness > 200 || brightness < 30) continue;
                    const rq = Math.round(r / 32) * 32;
                    const gq = Math.round(g / 32) * 32;
                    const bq = Math.round(b / 32) * 32;
                    const key = (rq << 16) | (gq << 8) | bq;
                    counts[key] = (counts[key] || 0) + 1;
                }
                let best = null, bestCount = 0;
                for (const [key, count] of Object.entries(counts)) {
                    if (count > bestCount) { bestCount = count; best = parseInt(key); }
                }
                if (best === null) { resolve(null); return; }
                const ro = (best >> 16) & 0xff, go = (best >> 8) & 0xff, bo = best & 0xff;
                resolve('#' + [ro, go, bo].map((v) => v.toString(16).padStart(2, '0')).join(''));
            };
            img.onerror = () => resolve(null);
            img.src = imagePath;
        });
    }

    async function importWerkstattDesign(fileEntry) {
        if (!fileEntry?.path) return;
        const label = buildLabelFromFileName(fileEntry.name);
        const quadrant = (await extractDarkColorFromImage(fileEntry.path)) || '#3d3428';
        const preset = window.addCustomBoardPreset({
            label,
            patternUrl: fileEntry.path,
            colors: {
                board: '#121212',
                quadrant,
                center: '#d4b896',
                accent: '#8b7355'
            }
        });
        if (preset?.id && typeof window.setPresetActive === 'function') {
            window.setPresetActive(preset.id, false);
        }
        setStatus('Design "' + label + '" importiert und in Werkstatt abgelegt.');
        renderImportGrid();
        renderGrid();
    }

    function renderImportGrid() {
        const section = document.getElementById('importSection');
        const grid = document.getElementById('importGrid');
        if (!section || !grid) return;

        const importedPaths = getImportedPatternPaths();
        const candidates = werkstattFiles.filter((fileEntry) => !importedPaths.has(normalizePatternPath(fileEntry.path)));
        section.classList.toggle('hidden', candidates.length === 0);
        grid.innerHTML = '';

        candidates.forEach((fileEntry) => {
            const card = document.createElement('div');
            card.className = 'preset-card';
            card.innerHTML = `
                <div class="preset-thumb">
                    <div class="preset-thumb-stage" style="background: linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32)), url('${esc(fileEntry.path).replace(/'/g, '%27')}') center/210px auto repeat; --thumb-quadrant: #3d3428; --thumb-center: #d4b896; --thumb-accent: #8b7355;">
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                    </div>
                </div>
                <div class="preset-card-body">
                    <div class="preset-card-meta">
                        <span class="preset-badge">Werkstatt</span>
                    </div>
                    <div class="preset-card-name">${esc(buildLabelFromFileName(fileEntry.name))}</div>
                    <div class="preset-card-desc">${esc(fileEntry.name)}</div>
                    <div class="preset-card-actions">
                        <button class="btn-import success">Import</button>
                    </div>
                </div>`;
            card.querySelector('.btn-import').addEventListener('click', () => importWerkstattDesign(fileEntry));
            grid.appendChild(card);
        });
    }

    // ── Grid render ──────────────────────────────────────────────────────────

    function renderGrid() {
        const grid    = document.getElementById('presetGrid');
        const all     = typeof window.getAllBoardPresets === 'function' ? window.getAllBoardPresets() : [];
        const current = typeof window.getBoardPreset    === 'function' ? window.getBoardPreset()    : '';
        grid.innerHTML = '';

        all.forEach((preset) => {
            const pv       = getPresetPreview(preset);
            const isActive  = preset.active !== false;
            const isBuiltin = !!preset.builtin;
            const isCurrent = (preset.id === current);

            const card = document.createElement('div');
            card.className = 'preset-card' + (isActive ? '' : ' inactive') + (isCurrent ? ' is-current' : '');

            card.innerHTML = `
                <div class="preset-thumb">
                    <div class="preset-thumb-stage" style="
                        background: ${thumbBg(pv)};
                        --thumb-quadrant: ${esc(pv.quadrant || '#3d3428')};
                        --thumb-center:   ${esc(pv.center   || '#d4b896')};
                        --thumb-accent:   ${esc(pv.accent   || '#8b7355')};">
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                    </div>
                    ${isCurrent ? '<span class="preset-current-badge">Aktiv</span>' : ''}
                </div>
                <div class="preset-card-body">
                    <div class="preset-card-meta">
                        <span class="preset-badge">${isBuiltin ? 'Eingebaut' : 'Eigenes'}</span>
                    </div>
                    <div class="preset-card-name">${esc(preset.label || preset.id)}</div>
                    <div class="preset-card-desc">${esc(preset.description || '')}</div>
                    <div class="preset-card-actions">
                        <button class="btn-toggle ${isActive ? 'active-on' : 'active-off'}" data-id="${esc(preset.id)}">
                            ${isActive ? 'Werkstatt' : 'Release'}
                        </button>
                        ${preset.id !== 'classic' ? `<button class="btn-delete danger" data-id="${esc(preset.id)}">Löschen</button>` : ''}
                    </div>
                </div>`;
            grid.appendChild(card);
        });

        grid.querySelectorAll('.btn-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id       = btn.dataset.id;
                const isActive = typeof window.isPresetActive === 'function' ? window.isPresetActive(id) : true;
                window.setPresetActive(id, !isActive);
                setStatus(isActive ? 'Design in Werkstatt verschoben.' : 'Design freigegeben.');
                renderGrid();
            });
        });

        grid.querySelectorAll('.btn-delete').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.id;
                const isBuiltin = typeof window.isBuiltinPreset === 'function' ? window.isBuiltinPreset(id) : false;
                const msg = isBuiltin
                    ? 'Eingebautes Design ausblenden? Es kann unter "Ausgeblendete Designs" wiederhergestellt werden.'
                    : 'Eigenes Design wirklich löschen? Dies kann nicht rückgängig gemacht werden.';
                if (!confirm(msg)) return;
                window.deleteCustomBoardPreset(id);
                setStatus('Design gelöscht.');
                renderHiddenSection();
                renderGrid();
            });
        });
    }

    // ── Hidden builtins section ──────────────────────────────────────────────

    function renderHiddenSection() {
        const section = document.getElementById('hiddenSection');
        const grid    = document.getElementById('hiddenGrid');
        if (!section || !grid) return;
        const hidden = typeof window.getHiddenBuiltinPresets === 'function' ? window.getHiddenBuiltinPresets() : [];
        section.classList.toggle('hidden', hidden.length === 0);
        grid.innerHTML = '';
        hidden.forEach((preset) => {
            const pv = getPresetPreview(preset);
            const card = document.createElement('div');
            card.className = 'preset-card inactive';
            card.innerHTML = `
                <div class="preset-thumb">
                    <div class="preset-thumb-stage" style="
                        background: ${thumbBg(pv)};
                        --thumb-quadrant: ${esc(pv.quadrant || '#3d3428')};
                        --thumb-center:   ${esc(pv.center   || '#d4b896')};
                        --thumb-accent:   ${esc(pv.accent   || '#8b7355')};">
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                        <div class="preset-thumb-q"></div>
                    </div>
                </div>
                <div class="preset-card-body">
                    <div class="preset-card-meta"><span class="preset-badge">Eingebaut</span></div>
                    <div class="preset-card-name">${esc(preset.label || preset.id)}</div>
                    <div class="preset-card-desc">${esc(preset.description || '')}</div>
                    <div class="preset-card-actions">
                        <button class="btn-restore success" data-id="${esc(preset.id)}">Wiederherstellen</button>
                    </div>
                </div>`;
            card.querySelector('.btn-restore').addEventListener('click', () => {
                window.restoreBuiltinPreset(preset.id);
                setStatus('Design "' + (preset.label || preset.id) + '" wiederhergestellt.');
                renderHiddenSection();
                renderGrid();
            });
            grid.appendChild(card);
        });
    }

    // ── Form live preview ────────────────────────────────────────────────────

    function updateFormPreview() {
        const stage = document.getElementById('formPreviewStage');
        const note  = document.getElementById('formPreviewNote');
        if (!stage) return;
        const board    = normalizeHex(document.getElementById('newBoardColorHex').value, '#121212');
        const quadrant = normalizeHex(document.getElementById('newQuadrantColorHex').value, '#3d3428');
        const center   = normalizeHex(document.getElementById('newCenterColorHex').value, '#d4b896');
        const accent   = normalizeHex(document.getElementById('newAccentColorHex').value, '#8b7355');
        const patternPath = document.getElementById('newPattern').value;

        if (patternPath) {
            stage.style.background = `linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32)), url("${patternPath}") center/160px auto repeat`;
        } else {
            stage.style.background = board;
        }
        stage.style.setProperty('--fpv-quadrant', quadrant);
        stage.style.setProperty('--fpv-center',   center);
        stage.style.setProperty('--fpv-accent',   accent);
        if (note) note.textContent = patternPath
            ? patternPath.split('/').pop()
            : 'Kein Muster – einfarbiges Board.';
    }

    // ── Color-pair binding ───────────────────────────────────────────────────

    function bindColorPair(pickerId, hexId) {
        const picker = document.getElementById(pickerId);
        const hex    = document.getElementById(hexId);
        picker.addEventListener('input', () => { hex.value = picker.value; updateFormPreview(); });
        hex.addEventListener('input', () => {
            const v = normalizeHex(hex.value, null); if (v) { picker.value = v; updateFormPreview(); }
        });
        hex.addEventListener('change', () => {
            const v = normalizeHex(hex.value, picker.value); hex.value = v; picker.value = v; updateFormPreview();
        });
    }

    // ── Buttons ──────────────────────────────────────────────────────────────

    document.getElementById('addBtn').addEventListener('click', () => {
        document.getElementById('addForm').classList.remove('hidden');
        document.getElementById('addBtn').classList.add('hidden');
        populatePatternSelect();
        updateFormPreview();
        document.getElementById('newLabel').focus();
    });

    document.getElementById('cancelNewBtn').addEventListener('click', () => {
        document.getElementById('addForm').classList.add('hidden');
        document.getElementById('addBtn').classList.remove('hidden');
    });

    document.getElementById('saveNewBtn').addEventListener('click', () => {
        const label = document.getElementById('newLabel').value.trim();
        if (!label) { setStatus('Bitte einen Namen eingeben.'); document.getElementById('newLabel').focus(); return; }
        const colors = {
            board:    normalizeHex(document.getElementById('newBoardColorHex').value,    '#121212'),
            quadrant: normalizeHex(document.getElementById('newQuadrantColorHex').value, '#3d3428'),
            center:   normalizeHex(document.getElementById('newCenterColorHex').value,   '#d4b896'),
            accent:   normalizeHex(document.getElementById('newAccentColorHex').value,   '#8b7355')
        };
        const patternUrl = document.getElementById('newPattern').value || null;
        const preset = window.addCustomBoardPreset({ label, patternUrl, colors });
        if (preset?.id && typeof window.setPresetActive === 'function') {
            window.setPresetActive(preset.id, false);
        }
        document.getElementById('addForm').classList.add('hidden');
        document.getElementById('addBtn').classList.remove('hidden');
        document.getElementById('newLabel').value = '';
        setStatus('Design "' + label + '" gespeichert und in Werkstatt abgelegt.');
        renderImportGrid();
        renderGrid();
    });

    document.getElementById('newPattern').addEventListener('change', async () => {
        updateFormPreview();
        const path = document.getElementById('newPattern').value;
        if (path) {
            const color = await extractDarkColorFromImage(path);
            if (color) {
                document.getElementById('newQuadrantColor').value = color;
                document.getElementById('newQuadrantColorHex').value = color;
                updateFormPreview();
            }
        }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.replace('config.html?v=20260429c');
    });

    bindColorPair('newBoardColor',    'newBoardColorHex');
    bindColorPair('newQuadrantColor', 'newQuadrantColorHex');
    bindColorPair('newCenterColor',   'newCenterColorHex');
    bindColorPair('newAccentColor',   'newAccentColorHex');

    // ── Init ─────────────────────────────────────────────────────────────────

    loadWerkstattFiles().then(() => {
        renderImportGrid();
        renderHiddenSection();
        renderGrid();
    });
</script>
</body>
</html>
