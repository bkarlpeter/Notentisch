<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaler Notentisch - Projekt Notentisch</title>

<style>
        :root {
            --card-stack-width: 260px;
            --stack-overlap: 20px;
            --control-bar-height: 60px;
            --center-bottom-gap: 80px;
            --card-height: 250px;
            --visible-zone: 10px;
        }

        body {
            margin: 0;
            background: #121212;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: white;
            height: 100vh;
        }

        /* --- LAYOUT CONTAINER --- */
        #layout-container {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 100vh;
            width: 100%;
        }

        /* --- LAYOUT 1: 2x2 (normal) --- */
        #layout-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        #layout-2x2.hidden { display: none; }

        /* --- LAYOUT 2: 2x2 COMPACT (breiteres Center) --- */
        #layout-80-20 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: 100%;
            position: relative;
            --card-stack-width: 140px;
        }

        #layout-80-20.hidden { display: none; }

        /* --- QUADRANTEN BASIS --- */
        .quadrant {
            border: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 80px 10px 10px;
            overflow-y: scroll;
            cursor: pointer;
        }

        .quadrant-links {
            align-items: flex-end;
            direction: rtl;
        }

        .quadrant-rechts {
            align-items: flex-end;
            direction: ltr;
        }
        
        .quadrant-links > * {
            direction: ltr;
        }

        .quadrant-rechts > * {
            direction: ltr;
        }


        .quadrant-stack-controls {
            position: absolute;
            top: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
        }

        .quadrant-stack-controls.left {
            left: 10px;
        }

        .quadrant-stack-controls.right {
            right: 10px;
        }

        .quadrant-stack-btn {
            width: 26px;
            height: 26px;
            border: 1px solid #3f5568;
            border-radius: 4px;
            background: #1f2e3a;
            color: #cfe8ff;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            padding: 0;
        }

        .quadrant-stack-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .center-stack-controls {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 2000;
            opacity: 0.7;
        }

        
        /* --- QUADRANT TITEL --- */
        .quadrant::before {
            position: absolute;
            top: 15px;
            font-size: 1.2rem;
            opacity: 0.4;
            font-weight: bold;
            color: #3498db;
            text-transform: uppercase;
            z-index: 10;
        }

        /* Q1 und Q2 Labels OBEN */
        #Q1::before { content: "zurückgestellt"; left: 20px; }
        #Q2::before { content: "Wiederholen"; right: 20px; }

        /* Q3 und Q4 Labels UNTEN */
        #Q3::before { 
            content: "Geübt"; 
            left: auto;
            right: 20px;
            top: auto;
            bottom: 15px;
        }

        #Q4::before { 
            content: "Gelernt"; 
            left: 20px;
            right: auto;
            top: auto;
            bottom: 15px;
        }

        /* --- CENTER-HOLE --- */
        .center-hole {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100vw - (2 * (var(--card-stack-width) - var(--stack-overlap))));
            height: calc(100vh - var(--control-bar-height) - var(--center-bottom-gap));
            background: #2c3e50;
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            border: 3px solid #3498db;
            padding: 12px 10px;
            box-sizing: border-box;
            min-width: 680px;
            max-width: 1400px;
        }

        #center-content {
            width: 100%;
            height: 100%;
            background: rgba(52, 152, 219, 0.12);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: auto;
            scroll-behavior: smooth;
            position: relative;
        }

        /* --- CENTER WIDE MODE --- */
        .center-hole.wide {
            left: 30px;
            right: calc(var(--card-stack-width) - var(--stack-overlap));
            transform: translateY(-50%);
            width: auto;
        }
        /* --- CENTER in Layout 2 - breiter --- */
        #layout-80-20 .center-hole {
            width: calc(100vw - 40px - (var(--card-stack-width) - var(--stack-overlap)));
            left: 20px;
        }

        /* --- CONTROL BAR --- */
        .control-bar {
            display: flex !important;
            gap: 10px;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: var(--control-bar-height);
            padding: 10px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            position: relative;
            z-index: 3000;
        }

        .btn {
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #3498db;
            color: white;
            font-weight: bold;
            width: 100px;
        }

        .btn:hover { background: #2980b9; }

        .btn.toggle {
            width: 100px;
            padding: 10px;
            background: #3498db;
        }

        .btn.toggle:hover {
            filter: brightness(0.95);
        }


        .btn-small {
            width: auto;
            padding: 6px 8px;
        }

        .btn-zoom {
            background: #555;
        }

        .btn-config {
            width: 34px;
            height: 34px;
            min-width: 34px;
            padding: 0;
            border-radius: 6px;
            border: 1px solid #4d4d4d;
            background: #1a1a1a;
            color: #c6d0da;
            font-weight: bold;
            line-height: 1;
        }

        .btn-config:hover {
            background: #1a1a1a;
            border-color: #4d4d4d;
        }

        .btn-end {
            width: auto;
            min-width: 58px;
            padding: 8px 10px;
            background: #7a2d2d;
            border: 1px solid #9a3a3a;
        }

        .btn-end:hover {
            background: #8f3434;
        }

        .separator {
            color: #666;
        }

        .page-info {
            min-width: 80px;
            text-align: center;
        }

        .stack-label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stack-input {
            width: 50px;
        }

        .hidden-file-input {
            display: none;
        }

        .center-placeholder {
            text-align: center;
            color: #9aa;
            font-size: 12px;
        }

        /* --- KARTEN - GESTAFFELT (10px pro Karte) --- */
        .card-container {
            width: 190px;
            text-align: center;
            flex-shrink: 0;
            cursor: grab;
            display: block;
            position: relative;
            transform-origin: top center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: calc(-1 * (var(--card-height) - var(--visible-zone)));
            draggable: true;
        }

        .card-container.visible { display: block; }

        .card-container:hover {
            transform: translateY(0px) scale(1.15) !important;
            z-index: 100 !important;
        }

        .card-container.in-center { display: none; }

        .card {
            width: 100%;
            height: var(--card-height);
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            background-size: cover;
            background-position: top;
        }

        .card:hover {
            box-shadow: 0 15px 40px rgba(52, 152, 219, 0.6);
        }

        .card-title {
            font-size: 11px;
            color: #ccc;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }

        /* --- GRID POSITIONEN --- */
        #Q1 { grid-column: 1; grid-row: 1; }
        #Q2 { grid-column: 2; grid-row: 1; }
        #Q4 { grid-column: 1; grid-row: 2; }
        #Q3 { grid-column: 2; grid-row: 2; }
</style>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Neue PDF-Pfad-Normalisierung -->
    <script src="normalizePdfServerPathV2.js?v=20260215"></script>
</head>

<body>

<div id="layout-container">

    <!-- LAYOUT 1: 2x2 + CENTER (normal) -->
    <div id="layout-2x2">
        
        <!-- CENTER -->
        <div class="center-hole" id="CENTER"
             ondrop="drop(event)"
             ondragover="event.preventDefault()"
             ondblclick="moveCardToQ2()">
            <div id="center-content">
                <div class="center-placeholder">
                    PDF im Center anzeigen
                </div>
            </div>
            <div id="scroll-buttons" class="quadrant-stack-controls right center-stack-controls">
                <button type="button" class="quadrant-stack-btn" onclick="scrollPdf('up')">&#9650;</button>
                <button type="button" class="quadrant-stack-btn" onclick="scrollPdf('down')">&#9660;</button>
            </div>
        </div>

        <!-- QUADRANTEN -->
        <div id="Q1" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q1')"></div>

        <div id="Q2" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q2')"></div>

        <div id="Q3" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q3')"></div>

        <div id="Q4" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q4')"></div>

    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
        <button class="btn" onclick="handleLoadButton()">LADEN</button>
        <button class="btn" id="modeToggleBtn" onclick="togglePlayMode()">Spielen</button>
        <button class="btn btn-small btn-zoom" onclick="zoomOut()">ZOOM -</button>
        <button class="btn btn-small btn-zoom" onclick="zoomIn()">ZOOM +</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfWidth()">Breite</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfHeight()">Höhe</button>
        <span class="separator">|</span>
        
        <button class="btn toggle" onclick="toggleWide()" id="wideBtn">Norm</button>
        <span class="separator">|</span>
        <button class="btn btn-small" onclick="previousPage()">&lt;</button>
        <span id="pageInfo" class="page-info"></span>
        <button class="btn btn-small" onclick="nextPage()">&gt;</button>
        
        <label class="stack-label">
            Blätter: 
            <input type="number" id="stackCount" value="8" min="1" max="10" class="stack-input">
            (max 10)
        </label>
        
        <input type="file" id="fileInput" accept=".xml" onchange="handleFile(event)" class="hidden-file-input">
        <span id="saveDateHint" class="separator" style="margin-left: auto;">Modus: Spielen (Datum automatisch)</span>
        <button class="btn btn-config" onclick="openConfigPage()" title="Config">C</button>
        <button class="btn btn-end" id="endBtn" onclick="requestShutdownAndExit()" title="Server beenden und schließen">Ende</button>
    </div>

</div>

    <!-- SCRIPTS -->
    <script src="functions.js?v=20260316"></script>
    <script src="filehandling.js?v=20260316"></script>

</body>
</html>
