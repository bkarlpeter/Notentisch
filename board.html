<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaler Notentisch - Projekt Notentisch</title>

<link rel="stylesheet" href="board.css?v=20260331a">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Neue PDF-Pfad-Normalisierung -->
    <script src="normalizePdfServerPathV2.js?v=20260215"></script>
</head>

<body>

    <!-- SUCH-OVERLAY -->
    <div id="search-overlay">
        <div id="search-panel">
            <h3>&#128269;&nbsp;Blatt suchen</h3>
            <input type="text" id="search-input" placeholder="Titel eingeben..." autocomplete="off"
                oninput="searchCards()" onkeydown="searchKeyDown(event)">
            <ul id="search-result-list"></ul>
            <div id="search-message"></div>
            <div class="search-btn-row">
                <button class="btn" onclick="closeSearchOverlay()">Fertig</button>
            </div>
        </div>
    </div>

<div id="layout-container">

    <!-- LAYOUT 1: 2x2 + CENTER (normal) -->
    <div id="layout-2x2">
        
        <!-- CENTER -->
        <div class="center-hole" id="CENTER"
             ondrop="drop(event)"
             ondragover="event.preventDefault()"
             ondblclick="moveCardToQ2()">
            <div id="center-content">
                <div class="center-placeholder">
                    PDF im Center anzeigen
                </div>
            </div>
            <div id="scroll-buttons" class="quadrant-stack-controls right center-stack-controls">
                <button type="button" class="quadrant-stack-btn" onclick="scrollPdf('up')">&#9650;</button>
                <button type="button" class="quadrant-stack-btn" onclick="scrollPdf('down')">&#9660;</button>
            </div>
        </div>

        <!-- QUADRANTEN -->
        <div id="Q1" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q1')"></div>

        <div id="Q2" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q2')"></div>

        <div id="Q3" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q3')"></div>

        <div id="Q4" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q4')"></div>

    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
        <button class="btn" onclick="handleLoadButton()">LADEN</button>
        <span class="separator">|</span>
        <button class="btn" id="modeToggleBtn" onclick="togglePlayMode()">Spielen</button>
        <button class="btn btn-small btn-zoom" id="zoomOutBtn" onclick="zoomOut()">ZOOM -</button>
        <button class="btn btn-small btn-zoom" id="zoomInBtn" onclick="zoomIn()">ZOOM +</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfWidth()">Breite</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfHeight()">Höhe</button>
        <span class="separator">|</span>
        
        <button class="btn toggle" onclick="toggleWide()" id="wideBtn">Norm</button>
        <button class="btn btn-small" onclick="toggleCenterAlign()" id="alignBtn">Links</button>
        <button class="btn btn-small" onclick="toggleSaveCenterSettingsMode()" id="saveCenterSettingsBtn">Auto Zoom</button>
        <span class="separator">|</span>
        <button class="btn btn-small" onclick="previousPage()">&lt;</button>
        <span id="pageInfo" class="page-info"></span>
        <button class="btn btn-small" onclick="nextPage()">&gt;</button>
        <span class="separator">|</span>
        <input type="file" id="fileInput" accept=".xml" onchange="handleFile(event)" class="hidden-file-input">
        <div class="toolbar-right">
            <button class="btn" id="textSearchBtn" onclick="openSearchOverlay()" title="Blatt suchen">Textsuche</button>
            <button class="btn" onclick="toggleAudioAssistMode()" id="audioAssistBtn" title="Kurz: 0→1 | Kurz in Ton An: Aus | Lang in Ton An (≥650ms): Aufnahme | In Aufnahme: Aus">Tonsuche</button>
            <span id="audioSaveBtn" title="Auto-Speichern Status">Speichern</span>
            <button class="btn btn-config" onclick="openConfigPage()" title="Config">C</button>
            <button class="btn btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreenMode()" title="Vollbild (F11 / Esc)">F11</button>
            <button class="btn btn-end" id="endBtn" onclick="requestShutdownAndExit()" title="Server beenden und schließen">Ende</button>
        </div>
    </div>

</div>

    <!-- SCRIPTS -->
    <script src="center-config.js?v=20260317b"></script>
    <script src="functions.js?v=20260317c"></script>
    <script src="center-view.js?v=20260315a"></script>
    <script src="render.js?v=20260317a"></script>
    <script src="filehandling.js?v=20260317h"></script>
    <script src="board-mode-state.js?v=20260404a"></script>
    <script src="board-session-state.js?v=20260404a"></script>
    <script src="board-dnd.js?v=20260404a"></script>
    <script src="board-search.js?v=20260404a"></script>
    <script src="audio-assist.js?v=20260321m"></script>

</body>
</html>
