<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Digitaler Notentisch - Projekt Notentisch</title>

<style>
        :root {
            --card-stack-width: 260px;
            --stack-overlap: 20px;
            --control-bar-height: 60px;
            --center-bottom-gap: 80px;
        }

        body {
            margin: 0;
            background: #121212;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: white;
            height: 100vh;
        }

        /* --- LAYOUT CONTAINER --- */
        #layout-container {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 100vh;
            width: 100%;
        }

        /* --- LAYOUT 1: 2x2 (normal) --- */
        #layout-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: 100%;
            position: relative;
        }

        #layout-2x2.hidden { display: none; }

        /* --- LAYOUT 2: 2x2 COMPACT (breiteres Center) --- */
        #layout-80-20 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: 100%;
            position: relative;
            --card-stack-width: 140px;
        }

        #layout-80-20.hidden { display: none; }

        /* --- QUADRANTEN BASIS --- */
        .quadrant {
            border: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 80px 10px 10px;
            overflow-y: scroll;
            cursor: pointer;
        }

        .quadrant-links {
            align-items: flex-end;
            direction: rtl;
        }

        .quadrant-rechts {
            align-items: flex-end;
            direction: ltr;
        }
        
        .quadrant-links > * {
            direction: ltr;
        }

        .quadrant-rechts > * {
            direction: ltr;
        }
        
        /* --- QUADRANT TITEL --- */
        .quadrant::before {
            position: absolute;
            top: 15px;
            font-size: 1.2rem;
            opacity: 0.4;
            font-weight: bold;
            color: #3498db;
            text-transform: uppercase;
            z-index: 10;
        }

        /* Q1 und Q2 Labels OBEN */
        #Q1::before { content: "zurückgestellt"; left: 20px; }
        #Q2::before { content: "Wiederholen"; right: 20px; }

        /* Q3 und Q4 Labels UNTEN */
        #Q3::before { 
            content: "Geübt"; 
            left: auto;
            right: 20px;
            top: auto;
            bottom: 15px;
        }

        #Q4::before { 
            content: "Gelernt"; 
            left: 20px;
            right: auto;
            top: auto;
            bottom: 15px;
        }

        /* --- CENTER-HOLE --- */
        .center-hole {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100vw - (2 * (var(--card-stack-width) - var(--stack-overlap))));
            height: calc(100vh - var(--control-bar-height) - var(--center-bottom-gap));
            background: #2c3e50;
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            border: 3px solid #3498db;
            padding: 12px 10px;
            box-sizing: border-box;
            min-width: 680px;
            max-width: 1400px;
        }

        #center-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            position: relative;
        }

        /* --- CENTER WIDE MODE --- */
        .center-hole.wide {
            left: 30px;
            transform: translateY(-50%);
            width: calc(100vw - 60px - (var(--card-stack-width) - var(--stack-overlap)));
        }
        /* --- CENTER in Layout 2 - breiter --- */
        #layout-80-20 .center-hole {
            width: calc(100vw - 40px - (var(--card-stack-width) - var(--stack-overlap)));
            left: 20px;
        }

        /* --- CONTROL BAR --- */
        .control-bar {
            display: flex !important;
            gap: 10px;
            align-items: center;
            padding: 10px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .btn {
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #3498db;
            color: white;
            font-weight: bold;
            width: 100px;
        }

        .btn:hover { background: #2980b9; }

        .btn.toggle {
            width: auto;
            padding: 8px 12px;
            background: #27ae60;
        }

        .btn.toggle:hover { background: #229954; }

        /* --- KARTEN - GESTAFFELT (10px pro Karte) --- */
        .card-container {
            width: 190px;
            text-align: center;
            flex-shrink: 0;
            cursor: grab;
            display: block;
            position: relative;
            transform-origin: top center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: -240px;
            draggable: true;
        }

        .card-container.visible { display: block; }

        .card-container:hover {
            transform: translateY(0px) scale(1.15) !important;
            z-index: 100 !important;
        }

        .card-container.in-center { display: none; }

        .card {
            width: 100%;
            height: 250px;
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            background-size: cover;
            background-position: top;
        }

        .card:hover {
            box-shadow: 0 15px 40px rgba(52, 152, 219, 0.6);
        }

        .card-title {
            font-size: 11px;
            color: #ccc;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }

        /* --- GRID POSITIONEN --- */
        #Q1 { grid-column: 1; grid-row: 1; }
        #Q2 { grid-column: 2; grid-row: 1; }
        #Q4 { grid-column: 1; grid-row: 2; }
        #Q3 { grid-column: 2; grid-row: 2; }
</style>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>

<body>

<div id="layout-container">

    <!-- LAYOUT 1: 2x2 + CENTER (normal) -->
    <div id="layout-2x2">
        
        <!-- CENTER -->
        <div class="center-hole" id="CENTER"
             ondrop="drop(event)"
             ondragover="event.preventDefault()"
             ondblclick="moveCardToQ2()">
            <div id="center-content">
                <div style="text-align:center; color:#9aa; font-size:12px;">
                    PDF im Center anzeigen
                </div>
            </div>
            <div id="scroll-buttons" style="display: none; position: absolute; right: 12px; top: 12px; flex-direction: column; gap: 8px; z-index: 2000; opacity: 0.6;">
                <button class="btn" onclick="scrollPdf('up')" style="width: 50px; height: 50px; font-size: 20px; padding: 0;">UP</button>
                <button class="btn" onclick="scrollPdf('down')" style="width: 50px; height: 50px; font-size: 20px; padding: 0;">DOWN</button>
            </div>
        </div>

        <!-- QUADRANTEN -->
        <div id="Q1" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q1')"></div>

        <div id="Q2" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q2')"></div>

        <div id="Q3" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q3')"></div>

        <div id="Q4" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q4')"></div>

    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
        <button class="btn" onclick="document.getElementById('fileInput').click()">LADEN</button>
        <button class="btn" onclick="saveXml()">SPEICHERN</button>
        <button class="btn" onclick="zoomOut()" style="width: auto; padding: 6px 8px; background: #555;">ZOOM -</button>
        <button class="btn" onclick="zoomIn()" style="width: auto; padding: 6px 8px; background: #555;">ZOOM +</button>
        <span style="color: #666;">|</span>
        
        <button class="btn toggle" onclick="toggleWide()" id="wideBtn">WIDE</button>
        <span style="color: #666;">|</span>
        <button class="btn" onclick="previousPage()" style="width: auto; padding: 6px 8px;">&lt;</button>
        <span id="pageInfo" style="min-width: 80px; text-align:center;"></span>
        <button class="btn" onclick="nextPage()" style="width: auto; padding: 6px 8px;">&gt;</button>
        
        <label style="display: flex; align-items: center; gap: 5px;">
            Sichtbar: 
            <input type="number" id="visibleHeight" value="10" min="1" max="250" style="width: 50px;">
            px
        </label>
        
        <label style="display: flex; align-items: center; gap: 5px;">
            Staffel: 
            <input type="number" id="staffelLimit" value="8" min="1" style="width: 50px;">
            Karten
        </label>
        
        <input type="file" id="fileInput" accept=".xml" onchange="handleFile(event)" style="display:none;">
    </div>

    <!-- SCRIPTS -->
    <script src="functions.js?v=20260215"></script>
    <script src="filehandling.js?v=20260215"></script>

</body>
</html>
