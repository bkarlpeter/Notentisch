<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaler Notentisch - Projekt Notentisch</title>

<style>
        :root {
            --card-stack-width: 260px;
            --stack-overlap: 20px;
            --control-bar-height: 60px;
            --center-bottom-gap: 32px;
            --quadrant-padding-top: 24px;
            --quadrant-padding-bottom: 6px;
            --center-min-width: 680px;
            --center-max-width: 1400px;
            --card-height: 250px;
            --stack-item-height: 268px;
            --visible-zone: 10px;
            --page-info-bg: #2a2a2a;
            --page-info-border: #4b5f73;
            --page-info-text: #d8e6f3;
        }

        body {
            margin: 0;
            background: #121212;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: white;
            height: 100vh;
        }

        /* --- LAYOUT CONTAINER --- */
        #layout-container {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 100vh;
            width: 100%;
        }

        /* --- LAYOUT 1: 2x2 (normal) --- */
        #layout-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        #layout-2x2.hidden { display: none; }

        /* --- LAYOUT 2: 2x2 COMPACT (breiteres Center) --- */
        #layout-80-20 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            height: 100%;
            position: relative;
            --card-stack-width: 140px;
        }

        #layout-80-20.hidden { display: none; }

        /* --- QUADRANTEN BASIS --- */
        .quadrant {
            border: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: var(--quadrant-padding-top) 10px var(--quadrant-padding-bottom);
            overflow-y: scroll;
            cursor: pointer;
            background: #3d3428;
        }

        .quadrant-links {
            align-items: flex-end;
            direction: rtl;
        }

        .quadrant-rechts {
            align-items: flex-end;
            direction: ltr;
        }
        
        .quadrant-links > * {
            direction: ltr;
        }

        .quadrant-rechts > * {
            direction: ltr;
        }


        .quadrant-stack-controls {
            position: absolute;
            top: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
        }

        .quadrant-stack-controls.left {
            left: 10px;
        }

        .quadrant-stack-controls.right {
            right: 10px;
        }

        .quadrant-stack-btn {
            width: 26px;
            height: 26px;
            border: 1px solid #3f5568;
            border-radius: 4px;
            background: #1f2e3a;
            color: #cfe8ff;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            padding: 0;
        }

        .quadrant-stack-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        
        /* --- QUADRANT TITEL --- */
        .quadrant::before {
            position: absolute;
            top: 15px;
            font-size: 1.2rem;
            opacity: 0.4;
            font-weight: bold;
            color: #3498db;
            text-transform: uppercase;
            z-index: 10;
        }

        /* Q1 und Q2 Labels OBEN */
        #Q1::before { content: "zurückgestellt"; left: 20px; }
        #Q2::before { content: "Wiederholen"; right: 20px; }

        /* Q3 und Q4 Labels UNTEN */
        #Q3::before { 
            content: "Geübt"; 
            left: auto;
            right: 20px;
            top: auto;
            bottom: 15px;
        }

        #Q4::before { 
            content: "Gelernt"; 
            left: 20px;
            right: auto;
            top: auto;
            bottom: 15px;
        }

        /* --- OVERVIEW MODE: 4 SPALTEN, OHNE CENTER --- */
        body.overview-mode #CENTER {
            display: none !important;
        }

        body.overview-mode #layout-2x2 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 1fr;
        }

        body.overview-mode #Q1 { grid-column: 1; grid-row: 1; }
        body.overview-mode #Q2 { grid-column: 2; grid-row: 1; }
        body.overview-mode #Q3 { grid-column: 3; grid-row: 1; }
        body.overview-mode #Q4 { grid-column: 4; grid-row: 1; }

        body.overview-mode #Q3::before,
        body.overview-mode #Q4::before {
            top: 0;
            bottom: auto;
        }

        body.overview-mode .quadrant::before {
            position: sticky;
            top: 0;
            left: 0 !important;
            right: auto !important;
            pointer-events: none;
            z-index: 30;
            display: inline-block;
            padding: 2px 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: rgba(18, 18, 18, 0.78);
            -webkit-backdrop-filter: blur(1px);
            backdrop-filter: blur(1px);
        }

        body.overview-mode .quadrant-links,
        body.overview-mode .quadrant-rechts {
            align-items: flex-start;
            direction: ltr;
        }

        body.overview-mode .quadrant {
            display: block;
            overflow-x: hidden;
            overflow-y: auto;
            padding-top: 10px;
            padding-left: 8px;
            padding-right: 8px;
        }

        body.overview-mode .card-container {
            width: calc(100% - 2px);
            max-width: none;
            margin-bottom: 10px !important;
        }

        body.overview-mode .card-container.in-center {
            display: block;
            border: 3px solid #3498db;
            border-radius: 8px;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.25);
            padding: 2px;
            box-sizing: border-box;
        }

        body.overview-mode .card-container:hover {
            transform: none !important;
        }

        /* --- CENTER-HOLE --- */
        .center-hole {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100vw - (2 * (var(--card-stack-width) - var(--stack-overlap))));
            height: calc(100vh - var(--control-bar-height) - var(--center-bottom-gap));
            background: #d4b896;
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0,0,0,0.9),
                        inset 0 0 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            border: 15px solid #8b7355;
            padding: 6px 8px;
            box-sizing: border-box;
            min-width: var(--center-min-width);
            max-width: var(--center-max-width);
        }

        #center-content {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            background: rgba(212, 184, 150, 0.08);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            overflow-y: auto;
            overflow-x: auto;
            scroll-behavior: smooth;
            position: relative;
        }

        /* --- CENTER WIDE MODE --- */
        .center-hole.wide {
            left: 30px;
            right: calc(var(--card-stack-width) - var(--stack-overlap));
            transform: translateY(-50%);
            width: auto;
        }
        /* --- CENTER in Layout 2 - breiter --- */
        #layout-80-20 .center-hole {
            width: calc(100vw - 40px - (var(--card-stack-width) - var(--stack-overlap)));
            left: 20px;
        }

        /* --- CONTROL BAR --- */
        .control-bar {
            display: flex !important;
            gap: 10px;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: var(--control-bar-height);
            padding: 10px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            position: relative;
            z-index: 3000;
        }

        .btn {
            cursor: pointer;
            padding: 0 10px;
            border-radius: 6px;
            border: none;
            background: var(--btn-base, #3498db);
            color: white;
            font-weight: bold;
            width: 100px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .btn:hover { filter: brightness(0.88); }

        .btn.toggle {
            width: 100px;
            padding: 10px;
            background: var(--btn-base, #3498db);
        }

        .btn.toggle:hover {
            filter: brightness(0.92);
        }

        .btn.toggle.full-state:hover {
            filter: brightness(0.92);
        }


        .btn-small {
            width: auto;
            padding: 0 8px;
        }

        .btn-zoom {
            background: #555;
        }

        .btn-config {
            width: 34px;
            height: 34px;
            min-width: 34px;
            padding: 0;
            border-radius: 6px;
            border: 1px solid #4d4d4d;
            background: #1a1a1a;
            color: #c6d0da;
            font-weight: bold;
            line-height: 1;
        }

        .btn-config:hover {
            background: #1a1a1a;
            border-color: #4d4d4d;
        }

        .btn-end {
            width: auto;
            min-width: 58px;
            padding: 0 10px;
            background: #7a2d2d;
            border: 1px solid #9a3a3a;
        }

        .btn-end:hover {
            background: #8f3434;
        }

        .btn-fullscreen {
            width: 44px;
            min-width: 44px;
            height: 34px;
            padding: 0;
            border-radius: 6px;
            border: 1px solid #4d4d4d;
            background: #1a1a1a;
            color: #c6d0da;
            font-weight: bold;
            line-height: 1;
        }

        .btn-fullscreen:hover {
            background: #1a1a1a;
            border-color: #4d4d4d;
        }

        .separator {
            color: #666;
        }

        .page-info {
            min-width: 80px;
            text-align: center;
            height: 34px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--page-info-bg);
            color: var(--page-info-text);
            border: 1px solid var(--page-info-border);
            border-radius: 6px;
            padding: 0 8px;
            box-sizing: border-box;
        }

        #alignBtn {
            width: 100px;
        }

        #modeToggleBtn {
            white-space: nowrap;
            text-align: center;
            padding: 0 10px;
        }

        #audio-record-progress {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 10px;
            text-align: center;
            padding: 0 8px;
            margin: 0;
            font-size: 12px;
            color: #999;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #audio-progress-label {
            margin-right: 8px;
            font-weight: 500;
        }

        #audio-progress-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        #audio-progress-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #ccc;
            transition: background-color 0.15s ease;
        }

        #audio-progress-dots span.filled {
            background-color: #27ae60;
        }

        #audio-record-progress.search-collecting {
            color: #7d8794;
        }

        #audio-record-progress.search-collecting #audio-progress-dots span.filled {
            background-color: #8f98a3;
        }

        #audio-record-progress.search-collecting #audio-record-progress-end {
            background: linear-gradient(135deg, #8f98a3, #6f7782);
        }

        #audio-record-progress.search-difficult {
            color: #9b7b57;
        }

        #audio-record-progress.search-difficult #audio-progress-dots span.filled {
            background-color: #8b5a2b;
        }

        #audio-record-progress-end {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #27ae60, #3498db);
            border-radius: 50%;
            margin-left: 6px;
        }

        #audio-record-progress.search-difficult #audio-record-progress-end {
            background: linear-gradient(135deg, #8b5a2b, #b78652);
        }

        #audioAssistBtn,
        #textSearchBtn {
            width: calc(10ch + 20px);
            min-width: calc(10ch + 20px);
            font-size: 12px;
            white-space: nowrap;
        }

        #audioSaveBtn {
            display: inline-flex;
            visibility: hidden;
            align-items: center;
            width: 78px;
            min-width: 78px;
            padding: 0 8px;
            background: #3498db;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
        }

        .toolbar-right {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        #commandStatus {
            margin-left: 8px;
            min-width: 180px;
            max-width: 460px;
            flex: 1 1 360px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            padding: 0 10px;
            border: 1px solid #3b4b59;
            border-radius: 6px;
            background: #121a22;
            color: #cfe3f4;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #saveDateHint {
            margin-left: auto;
            display: inline-block;
            min-width: 120px;
            max-width: 180px;
            flex: 0 1 180px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
        }

        #audioAssistStatus {
            min-width: 0;
            max-width: 130px;
            flex: 0 1 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 1500px) {
            .control-bar {
                gap: 8px;
                padding: 8px;
            }

            .btn {
                width: 92px;
                font-size: 12px;
            }

            #alignBtn {
                width: 92px;
            }

            #audioAssistBtn,
            #textSearchBtn {
                width: calc(9ch + 18px);
                min-width: calc(9ch + 18px);
                font-size: 11px;
            }

            .toolbar-right {
                gap: 8px;
            }

            #saveDateHint,
            #audioAssistStatus {
                display: none;
            }

            #commandStatus,
            .page-info {
                max-width: 320px;
                font-size: 11px;
            }
        }

        @media (max-width: 1280px) {
            .control-bar {
                gap: 6px;
            }

            .btn {
                width: 84px;
                font-size: 11px;
            }

            .toolbar-right {
                gap: 6px;
            }

            #commandStatus {
                min-width: 140px;
                max-width: 220px;
                flex-basis: 180px;
            }

            #alignBtn {
                width: 84px;
            }

            #modeToggleBtn,
            #audioAssistBtn,
            #textSearchBtn {
                white-space: normal;
                line-height: 1.03;
                height: 34px;
                padding: 2px 6px;
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
            }

            #audioAssistBtn,
            #textSearchBtn {
                width: 76px;
                min-width: 76px;
            }

            #saveDateHint {
                margin-left: auto;
                min-width: 0;
                width: 84px;
                max-width: 84px;
                flex: 0 1 84px;
                white-space: normal;
                line-height: 1.05;
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                word-break: break-word;
                overflow-wrap: anywhere;
                text-align: left;
            }

            #audioAssistStatus {
                width: 76px;
                max-width: 76px;
                flex: 0 1 76px;
                font-size: 11px;
                white-space: normal;
                line-height: 1.05;
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                word-break: break-word;
                overflow-wrap: anywhere;
            }

        }

        @media (max-width: 1100px) {
            .control-bar {
                gap: 4px;
                padding: 6px;
            }

            .btn {
                width: 76px;
                font-size: 10px;
            }

            .toolbar-right {
                gap: 4px;
            }

            #alignBtn {
                width: 76px;
            }

            #modeToggleBtn,
            #audioAssistBtn,
            #textSearchBtn {
                width: 72px;
                min-width: 72px;
            }

            #audioAssistStatus {
                width: 68px;
                max-width: 68px;
                flex: 0 1 68px;
            }

            #saveDateHint {
                width: 74px;
                max-width: 74px;
                flex: 0 1 74px;
            }
        }

        .hidden-file-input {
            display: none;
        }

        /* --- SUCH-OVERLAY --- */
        #search-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        #search-overlay.visible {
            display: flex;
        }
        #search-panel {
            background: #1e2a35;
            border: 1px solid #3d5a73;
            border-radius: 10px;
            padding: 28px 32px 24px;
            min-width: 340px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #search-panel h3 {
            margin: 0;
            font-size: 15px;
            color: #c6d8ea;
            font-weight: bold;
            letter-spacing: 0.03em;
        }
        #search-input {
            width: 100%;
            box-sizing: border-box;
            background: #152028;
            border: 1px solid #3d5a73;
            color: #dde8f0;
            border-radius: 5px;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
        }
        #search-input:focus {
            border-color: #5a9fd4;
        }
        #search-result-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 260px;
            overflow-y: auto;
        }
        #search-result-list li {
            background: #1a3045;
            border: 1px solid #2e4a62;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        #search-result-list li:hover {
            background: #1f4060;
        }
        .result-title {
            font-weight: bold;
            color: #d0e8ff;
            font-size: 13px;
        }
        .result-status {
            font-size: 11px;
            color: #7aa8c8;
            margin-top: 2px;
        }
        #search-message {
            font-size: 13px;
            color: #7ecfa0;
            min-height: 18px;
        }
        .search-btn-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .center-placeholder {
            text-align: center;
            color: #9aa;
            font-size: 12px;
        }

        #center-filename-label {
            position: absolute;
            bottom: -22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
            pointer-events: none;
        }

        /* --- KARTEN - GESTAFFELT (10px pro Karte) --- */
        .card-container {
            width: 190px;
            text-align: center;
            flex-shrink: 0;
            cursor: grab;
            display: block;
            position: relative;
            transform-origin: top center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: calc(-1 * (var(--stack-item-height) - var(--visible-zone)));
        }

        .card-container.visible { display: block; }

        /* Transitions während programmatischem Board-Rebuild unterdrücken */
        .board-rendering .card-container {
            transition: none !important;
        }

        .card-container:hover {
            transform: translateY(0px) scale(1.15) !important;
            z-index: 100 !important;
        }

        .card-container.drop-glow {
            z-index: 160 !important;
        }

        .card-container.drop-glow .card {
            box-shadow:
                0 0 0 2px rgba(52, 152, 219, 0.95),
                0 0 22px rgba(52, 152, 219, 0.85),
                0 8px 20px rgba(0,0,0,0.8);
        }

        .card-container.in-center { display: none; }

        .card {
            width: 100%;
            height: var(--card-height);
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            background-size: cover;
            background-position: top;
        }

        .card:hover {
            box-shadow: 0 15px 40px rgba(52, 152, 219, 0.6);
        }

        .card-title {
            font-size: 11px;
            color: #ccc;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }

        .card-audio-badge {
            position: absolute;
            top: 1px;
            right: 2px;
            width: 6px;
            height: 6px;
            border-radius: 2px;
            background: #ffd54a;
            border: 1px solid rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 1px rgba(255, 213, 74, 0.35);
            z-index: 2;
            pointer-events: none;
        }

        .card-audio-badge.good {
            background: #4fd66d;
            box-shadow: 0 0 0 1px rgba(79, 214, 109, 0.35);
        }

        .card-audio-badge.weak {
            background: #ffd54a;
            box-shadow: 0 0 0 1px rgba(255, 213, 74, 0.35);
        }

        /* --- GRID POSITIONEN --- */
        #Q1 { grid-column: 1; grid-row: 1; }
        #Q2 { grid-column: 2; grid-row: 1; }
        #Q4 { grid-column: 1; grid-row: 2; }
        #Q3 { grid-column: 2; grid-row: 2; }
</style>

    <link rel="stylesheet" href="board-presets.css?v=20260429c">
    <script src="board-presets.js?v=20260429c"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Neue PDF-Pfad-Normalisierung -->
    <script src="normalizePdfServerPathV2.js?v=20260215"></script>
</head>

<body>

    <!-- SUCH-OVERLAY -->
    <div id="search-overlay">
        <div id="search-panel">
            <h3>&#128269;&nbsp;Blatt suchen</h3>
            <input type="text" id="search-input" placeholder="Titel eingeben..." autocomplete="off" inputmode="search" enterkeyhint="search" spellcheck="false"
                oninput="searchCards()" onkeydown="searchKeyDown(event)" onclick="searchInputClicked()" onfocus="searchInputClicked()">
            <ul id="search-result-list"></ul>
            <div id="search-message"></div>
            <div class="search-btn-row">
                <button class="btn" onclick="closeSearchOverlay()">Fertig</button>
            </div>
        </div>
    </div>

<div id="layout-container">

    <!-- LAYOUT 1: 2x2 + CENTER (normal) -->
    <div id="layout-2x2">
        
        <!-- CENTER -->
        <div class="center-hole" id="CENTER"
             ondrop="drop(event)"
             ondragover="event.preventDefault()"
             ondblclick="moveCardToQ2(event)">
            <div id="center-content">
                <div class="center-placeholder">
                    PDF im Center anzeigen
                </div>
            </div>
            <div id="center-filename-label"></div>
            <div id="audio-record-progress">
                <span id="audio-progress-label">Searching</span>
                <span id="audio-progress-dots"></span>
            </div>
        </div>

        <!-- QUADRANTEN -->
        <div id="Q1" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q1')"></div>

        <div id="Q2" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q2')"></div>

        <div id="Q3" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q3')"></div>

        <div id="Q4" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q4')"></div>

    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
        <button class="btn" onclick="handleLoadButton()">LADEN</button>
        <button class="btn btn-small" id="blaetterPickBtn" onclick="pickBlaetterDir()" title="Blätter-Ordner wählen">Blätter 📁</button>
        <span class="separator">|</span>
        <button class="btn" id="modeToggleBtn" onclick="togglePlayMode()">Spielen</button>
        <button class="btn btn-small btn-zoom" id="zoomOutBtn" onclick="zoomOut()">ZOOM -</button>
        <button class="btn btn-small btn-zoom" id="zoomInBtn" onclick="zoomIn()">ZOOM +</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfWidth()">Breite</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfHeight()">Höhe</button>
        <span class="separator">|</span>
        
        <button class="btn toggle" onclick="toggleWide()" id="wideBtn">Norm</button>
        <button class="btn btn-small" onclick="toggleCenterAlign()" id="alignBtn">Links</button>
        <button class="btn btn-small" onclick="toggleSaveCenterSettingsMode()" id="saveCenterSettingsBtn">Auto Zoom</button>
        <span class="separator">|</span>
        <button class="btn btn-small" onclick="previousPage()">&lt;</button>
        <span id="pageInfo" class="page-info">Seiten</span>
        <button class="btn btn-small" onclick="nextPage()">&gt;</button>
        <span class="separator">|</span>
        <input type="file" id="fileInput" accept=".xml" onchange="handleFile(event)" class="hidden-file-input">
        <span id="commandStatus" title="Status">Bereit</span>
        <div class="toolbar-right">
            <button class="btn" id="overviewBtn" onclick="toggleOverviewMode()">Übersicht</button>
            <button class="btn" id="textSearchBtn" onclick="openSearchOverlay()" title="Blatt suchen">Textsuche</button>
            <button class="btn" onclick="toggleAudioAssistMode(event)" id="audioAssistBtn" title="Kurz: Aus→Hören, Hören→Aus. Lang (in Hören): Aufnahme. In Aufnahme: Kurz=Aus.">Hören</button>
            <span id="audioSaveBtn" title="Auto-Speichern Status">Speichern</span>
            <button class="btn btn-config" onclick="openConfigPage()" title="Staffelung">C</button>
            <button class="btn btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreenMode()" title="Vollbild (F11 / Esc)">F11</button>
            <button class="btn btn-end" id="endBtn" onclick="requestShutdownAndExit()" title="Server beenden und schließen">Ende</button>
        </div>
    </div>

</div>

    <!-- SCRIPTS -->
    <script src="center-config.js?v=20260412n"></script>
    <script src="render.js?v=20260427g"></script>
    <script src="filehandling.js?v=20260715a"></script>
    <script src="board-session-state.js?v=20260427b"></script>
    <script src="functions.js?v=20260427a"></script>
    <script src="center-view.js?v=20260411f"></script>
    <script src="audio_core.js?v=20260605a"></script>
    <script src="audio_data.js?v=20260427a"></script>
    <script src="audio_runtime.js?v=20260605a"></script>

</body>
</html>
