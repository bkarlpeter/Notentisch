<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaler Notentisch - Projekt Notentisch</title>

    <link rel="stylesheet" href="quadrant-titles.css?v=20260510b">
    <link rel="stylesheet" href="styles.css?v=20260821b">
    <link rel="stylesheet" href="board-presets.css?v=20260502a">

    <script src="board-presets.js?v=20260821b"></script>

    <script async src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script src="normalizePdfServerPathV2.js?v=20260215"></script>
</head>

<body>
    <script>
        (function applyLastPresetEarly() {
            try {
                const raw = localStorage.getItem('notentischUserConfig');
                let preset = '';
                if (raw) {
                    const cfg = JSON.parse(raw);
                    if (typeof cfg?.boardPreset === 'string') preset = cfg.boardPreset;
                }
                if (!preset) {
                    preset = localStorage.getItem('notentischBoardPreset') || '';
                }
                preset = String(preset || '').trim().toLowerCase() || 'carved-a';
                document.body.setAttribute('data-board-preset', preset);
            } catch {
                document.body.setAttribute('data-board-preset', 'carved-a');
            }
        })();
    </script>

    <!-- SUCH-OVERLAY -->
    <div id="search-overlay">
        <div id="search-panel">
            <h3>&#128269;&nbsp;Blatt suchen</h3>
            <input type="text" id="search-input" placeholder="Titel eingeben..." autocomplete="off" inputmode="search" enterkeyhint="search" spellcheck="false"
                oninput="searchCards()" onkeydown="searchKeyDown(event)" onclick="searchInputClicked()" onfocus="searchInputClicked()">
            <ul id="search-result-list"></ul>
            <div id="search-message"></div>
            <div class="search-btn-row">
                <button class="btn" onclick="closeSearchOverlay()">Fertig</button>
            </div>
        </div>
    </div>

<div id="layout-container">

    <!-- LAYOUT 1: 2x2 + CENTER (normal) -->
    <div id="layout-2x2">
        
        <!-- CENTER -->
        <div class="center-hole" id="CENTER"
             ondrop="drop(event)"
             ondragover="event.preventDefault()"
             ondblclick="moveCardToQ2(event)">
            <div id="center-content">
                <div class="center-placeholder">
                    PDF im Center anzeigen
                </div>
            </div>
            <div id="blaetterHint">Blätter-Ordner nicht gewählt &nbsp;<button class="blaetter-hint-pick" onclick="pickBlaetterDir()">Wählen</button>&nbsp;<button class="blaetter-hint-close" onclick="document.getElementById('blaetterHint').style.display='none'">&#x2715;</button></div>
            <div id="center-filename-label"></div>
            <div id="audio-record-progress">
                <span id="audio-progress-label">Searching</span>
                <span id="audio-progress-dots"></span>
            </div>
        </div>

        <!-- QUADRANTEN -->
        <div id="Q1" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q1')"></div>

        <div id="Q2" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q2')"></div>

        <div id="Q3" class="quadrant quadrant-rechts"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q3')"></div>

        <div id="Q4" class="quadrant quadrant-links"
            ondrop="drop(event)" ondragover="event.preventDefault()" onclick="moveCardFromCenterTo('Q4')"></div>

    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
        <button class="btn" onclick="handleLoadButton()">LADEN</button>
        <span class="separator">|</span>
        <button class="btn" id="modeToggleBtn" onclick="togglePlayMode()">Spielen</button>
        <button class="btn btn-small btn-zoom" id="zoomOutBtn" onclick="zoomOut()">ZOOM -</button>
        <button class="btn btn-small btn-zoom" id="zoomInBtn" onclick="zoomIn()">ZOOM +</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfWidth()">Breite</button>
        <button class="btn btn-small btn-zoom" onclick="fitPdfHeight()">Höhe</button>
        <span class="separator">|</span>
        
        <button class="btn toggle" onclick="toggleWide()" id="wideBtn">Norm</button>
        <button class="btn btn-small" onclick="toggleCenterAlign()" id="alignBtn">Links</button>
        <button class="btn btn-small" onclick="toggleSaveCenterSettingsMode()" id="saveCenterSettingsBtn">Auto Zoom</button>
        <span class="separator">|</span>
        <button class="btn btn-small" onclick="previousPage()">&lt;</button>
        <span id="pageInfo" class="page-info">Seiten</span>
        <button class="btn btn-small" onclick="nextPage()">&gt;</button>
        <span class="separator">|</span>
        <input type="file" id="fileInput" accept=".xml" onchange="handleFile(event)" class="hidden-file-input">
        <span id="commandStatus" title="Status">Bereit</span>
        <div class="toolbar-right">
            <button class="btn" id="overviewBtn" onclick="toggleOverviewMode()">Übersicht</button>
            <button class="btn" id="textSearchBtn" onclick="openSearchOverlay()" title="Blatt suchen">Textsuche</button>
            <button class="btn" onclick="toggleAudioAssistMode(event)" id="audioAssistBtn" title="Kurz: Aus→Hören, Hören→Aus. Lang (in Hören): Aufnahme. In Aufnahme: Kurz=Aus.">Hören</button>
            <span id="audioSaveBtn" title="Auto-Speichern Status">Speichern</span>
            <button class="btn btn-config" onclick="openConfigPage()" title="Staffelung">C</button>
            <button class="btn btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreenMode()" title="Vollbild (F11 / Esc)">F11</button>
            <button class="btn btn-end" id="endBtn" onclick="requestShutdownAndExit()" title="Server beenden und schließen">Ende</button>
        </div>
    </div>

</div>

    <!-- SCRIPTS -->
    <script src="center-config.js?v=20260412n"></script>
    <script src="render.js?v=20260811a"></script>
    <script src="filehandling.js?v=20260821b"></script>
    <script src="board-session-state.js?v=20260427b"></script>
    <script src="functions.js?v=20260427a"></script>
    <script src="center-view.js?v=20260811a"></script>
    <script src="audio_core.js?v=20260605a"></script>
    <script src="audio_data.js?v=20260427a"></script>
    <script src="audio_runtime.js?v=20260605a"></script>

</body>
</html>
