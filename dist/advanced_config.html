<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notentisch Advanced</title>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 24px; box-sizing: border-box; }
        .card { width: min(800px, 100%); background: #1b1b1b; border: 1px solid #2f2f2f; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 20px; margin: 0 0 10px; }
        .hint { color: #a9a9a9; font-size: 13px; margin: 0 0 20px; }

        /* Funktionsgruppen */
        .group { margin-bottom: 20px; }
        .group-header { border-top: 2px solid #3a6a9a; padding-top: 8px; margin-bottom: 8px; }
        .group-title { margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #6aa8d0; }
        .group-body { background: linear-gradient(160deg, #1f2e3a 0%, #121d26 100%); border-radius: 8px; padding: 12px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
        .group-body.cols-2 { grid-template-columns: repeat(2, 1fr); }
        @media (max-width: 560px) { .group-body, .group-body.cols-2 { grid-template-columns: 1fr; } }

        .field { border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 10px; background: rgba(0,0,0,0.22); display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; font-size: 13px; }
        input[type="number"], select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #3a3a3a; background: #111; color: #fff; }
        input[type="color"] { width: 56px; height: 40px; border-radius: 6px; border: 1px solid #3a3a3a; background: #111; padding: 2px; cursor: pointer; }

        /* Farben-Gruppe */
        .field-btn-color { display: none; }
        .group-hidden { display: none; }
        .field-color-visible { display: flex; }
        .btn-color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-color-name { min-width: 92px; color: #c8c8c8; font-size: 13px; }
        .btn-color-hex { width: 88px; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #3a3a3a; background: #111; color: #fff; font-family: 'Courier New', monospace; font-size: 13px; }
        .btn-color-swatches { display: flex; align-items: center; gap: 6px; margin-left: 6px; }
        .swatch-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .swatch-box { width: 32px; height: 28px; border-radius: 5px; border: 1px solid #555; display: inline-block; }
        .swatch-lbl { font-size: 10px; color: #888; white-space: nowrap; }

        .actions { display: flex; gap: 10px; margin-top: 18px; }
        button { padding: 10px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; background: #3498db; color: #fff; }
        button.secondary { background: #3a3a3a; }
        #backBtn { margin-left: auto; }
        #status { margin-top: 12px; font-size: 13px; color: #a9d8ff; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Advanced Settings</h1>
        <p class="hint">Erweiterte Parameter. Änderungen werden direkt gespeichert.</p>

        <!-- GRUPPE: Zoom -->
        <div class="group">
            <div class="group-header"><h2 class="group-title">Zoom</h2></div>
            <div class="group-body">
                <div class="field"><label for="centerDefaultZoom">Start-Zoom</label><input id="centerDefaultZoom" type="number" min="0.05" max="2.0" step="0.01"></div>
                <div class="field"><label for="centerMinZoom">Min-Zoom</label><input id="centerMinZoom" type="number" min="0.05" max="2.0" step="0.01"></div>
                <div class="field"><label for="centerMaxZoom">Max-Zoom</label><input id="centerMaxZoom" type="number" min="0.2" max="5.0" step="0.05"></div>
                <div class="field"><label for="centerZoomDebounceMs">Render-Verzögerung (ms)</label><input id="centerZoomDebounceMs" type="number" min="20" max="600" step="10"></div>
                <div class="field"><label for="centerZoomHoldEnabled">Dauerzoom</label><select id="centerZoomHoldEnabled"><option value="show">Aktiv</option><option value="hide">Inaktiv</option></select></div>
                <div class="field"><label for="centerZoomHoldDelayMs">Dauerzoom Start-Delay (ms)</label><input id="centerZoomHoldDelayMs" type="number" min="80" max="1000" step="10"></div>
                <div class="field"><label for="centerZoomHoldIntervalMs">Dauerzoom Intervall (ms)</label><input id="centerZoomHoldIntervalMs" type="number" min="30" max="400" step="5"></div>
            </div>
        </div>

        <!-- GRUPPE: Center-Darstellung -->
        <div class="group">
            <div class="group-header"><h2 class="group-title">Center-Darstellung</h2></div>
            <div class="group-body">
                <div class="field"><label for="centerCanvasExtraWidth">Spalt Center-Stapel</label><input id="centerCanvasExtraWidth" type="number" min="0" max="40" step="1"></div>
                <div class="field"><label for="centerFitMonitorPages">Fit-Breite Seitenzahl (2:3)</label><input id="centerFitMonitorPages" type="number" min="1" max="6" step="1"></div>
                <div class="field"><label for="centerSmoothScroll">Smooth-Scroll</label><select id="centerSmoothScroll"><option value="show">Aktiv</option><option value="hide">Inaktiv</option></select></div>
                <div class="field"><label for="pageInfoTone">Seitenanzeige Helligkeit</label><select id="pageInfoTone"><option value="dunkel">Dunkel</option><option value="normal">Normal</option><option value="hell">Hell</option></select></div>
                <div class="field"><label for="autoFullscreenOnStart">Auto-Fullscreen</label><select id="autoFullscreenOnStart"><option value="show">Aktiv</option><option value="hide">Inaktiv</option></select></div>
            </div>
        </div>

        <!-- GRUPPE: Verzeichnisse -->
        <div class="group">
            <div class="group-header"><h2 class="group-title">Verzeichnisse</h2></div>
            <div class="group-body cols-1">
                <div class="field field-full">
                    <label>Blätter (PDF)</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span id="blaetterDirDisplay" style="flex: 1; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; font-size: 13px; word-break: break-all;">(nicht gewählt)</span>
                        <button type="button" onclick="pickBlaetterDir()" style="padding: 8px 12px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;">Wählen</button>
                    </div>
                </div>
                <div class="field field-full">
                    <label>Cards_Export (Vorschaubilder)</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span id="cardsExportDirDisplay" style="flex: 1; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; font-size: 13px; word-break: break-all;">(nicht gewählt)</span>
                        <button type="button" onclick="pickCardsExportDir()" style="padding: 8px 12px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;">Wählen</button>
                    </div>
                </div>
                <div class="field field-full">
                    <label>Werkstatt (Design-Muster)</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span id="werkstattDirDisplay" style="flex: 1; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; font-size: 13px; word-break: break-all;">(nicht gewählt)</span>
                        <button type="button" onclick="pickWerkstattDir()" style="padding: 8px 12px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;">Wählen</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- GRUPPE: Karten & Stapel -->
        <div class="group">
            <div class="group-header"><h2 class="group-title">Karten &amp; Stapel</h2></div>
            <div class="group-body cols-2">
                <div class="field"><label for="dropGlowDurationMs">Nachglühen bei Ablage (ms)</label><input id="dropGlowDurationMs" type="number" min="0" max="10000" step="50"></div>
                <div class="field"><label for="stackBatchOverlapCount">Stapel-Überlappung je Batch</label><input id="stackBatchOverlapCount" type="number" min="0" max="9" step="1"></div>
                <div class="field"><label for="cardSharpness">Karten-Schärfe</label><select id="cardSharpness"><option value="normal">Norm</option><option value="scharf1">Scharf1</option><option value="scharf2">Scharf2</option></select></div>
                <div class="field"><label for="pdfBaseDir">PDF-Basisordner</label><select id="pdfBaseDir"><option value="Blätter">Blätter (Standard)</option><option value="Noten/Blätter">Noten/Blätter</option><option value="Noten">Noten</option></select></div>
            </div>
        </div>

        <!-- GRUPPE: Audio-Erkennung -->
        <div class="group">
            <div class="group-header"><h2 class="group-title">Audio-Erkennung</h2></div>
            <div class="group-body">
                <div class="field"><label for="audioReferenceTargetMs">Referenzdauer (ms)</label><input id="audioReferenceTargetMs" type="number" min="1500" max="12000" step="100"></div>
                <div class="field"><label for="audioRecordStartDelayMs">Aufnahme-Start-Delay (ms)</label><input id="audioRecordStartDelayMs" type="number" min="0" max="3000" step="100"></div>
                <div class="field"><label for="audioWaitAfterMatchMs">Wartezeit nach Treffer (ms)</label><input id="audioWaitAfterMatchMs" type="number" min="4000" max="8000" step="100"></div>
                <div class="field"><label for="audioResetOnSilenceMs">Neuansatz-Pause (ms)</label><select id="audioResetOnSilenceMs"><option value="800">800</option><option value="1000">1000</option><option value="1500">1500</option></select></div>
                <div class="field"><label for="replaceAudioByTitle">Alte Sequenz</label><select id="replaceAudioByTitle"><option value="show">Löschen</option><option value="hide">Beibehalten</option></select></div>
                <div class="field"><label for="audioMatchExceptionalModesEnabled">Sondermodi</label><select id="audioMatchExceptionalModesEnabled"><option value="hide">Nur Normal</option><option value="show">Freigeben</option></select></div>
                <div class="field"><label for="audioMatchStrictness">Erkennungs-Strenge</label><select id="audioMatchStrictness"><option value="locker">Locker</option><option value="normal">Normal</option><option value="streng">Streng</option></select></div>
            </div>
        </div>

        <!-- GRUPPE: Farben (ausgeblendet) -->
        <div class="group group-hidden">
            <div class="group-header"><h2 class="group-title">Farben</h2></div>
            <div class="group-body">
                <div class="field field-btn-color field-color-visible">
                    <label>Button Grundfarbe (Ausgangszustand)</label>
                    <div class="btn-color-row">
                        <span class="btn-color-name">Basis</span>
                        <input type="color" id="btnBaseColorPicker" title="Farbe wählen">
                        <input type="text" id="btnBaseColorHex" class="btn-color-hex" maxlength="7" placeholder="#3498db" spellcheck="false">
                    </div>
                    <div class="btn-color-row">
                        <span class="btn-color-name">Toggle 1</span>
                        <input type="color" id="btnToggleColor1Picker" title="Farbe wählen">
                        <input type="text" id="btnToggleColor1Hex" class="btn-color-hex" maxlength="7" placeholder="#27ae60" spellcheck="false">
                    </div>
                    <div class="btn-color-row">
                        <span class="btn-color-name">Toggle 2</span>
                        <input type="color" id="btnToggleColor2Picker" title="Farbe wählen">
                        <input type="text" id="btnToggleColor2Hex" class="btn-color-hex" maxlength="7" placeholder="#52be80" spellcheck="false">
                    </div>
                    <div class="btn-color-row">
                        <div class="btn-color-swatches">
                            <div class="swatch-group"><span class="swatch-box" id="swatchBase"></span><span class="swatch-lbl">Basis</span></div>
                            <div class="swatch-group"><span class="swatch-box" id="swatchToggle1"></span><span class="swatch-lbl">1. Toggle</span></div>
                            <div class="swatch-group"><span class="swatch-box" id="swatchToggle2"></span><span class="swatch-lbl">2. Toggle</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="saveBtn" type="button">Speichern</button>
            <button id="backBtn" type="button" class="secondary">Zurück zu Config</button>
        </div>
        <div id="status"></div>
    </div>

    <script src="center-config.js?v=20260412n"></script>
    <script>
        // Verzeichnis-Picker: stehen nur in diesem Script zur Verfügung (filehandling.js wird hier nicht geladen)
        let blaetterDirHandle = null;
        let cardsExportDirHandle = null;
        let werkstattDirHandle = null;

        function updateDirDisplay() {
            const b = document.getElementById('blaetterDirDisplay');
            const c = document.getElementById('cardsExportDirDisplay');
            const w = document.getElementById('werkstattDirDisplay');
            if (b) { b.textContent = blaetterDirHandle ? ('\uD83D\uDCC1 ' + blaetterDirHandle.name) : '(nicht gewählt)'; b.style.color = blaetterDirHandle ? '#52be80' : '#888'; }
            if (c) { c.textContent = cardsExportDirHandle ? ('\uD83D\uDCC1 ' + cardsExportDirHandle.name) : '(nicht gewählt)'; c.style.color = cardsExportDirHandle ? '#52be80' : '#888'; }
            if (w) { w.textContent = werkstattDirHandle ? ('\uD83D\uDCC1 ' + werkstattDirHandle.name) : '(nicht gewählt)'; w.style.color = werkstattDirHandle ? '#52be80' : '#888'; }
        }

        async function pickBlaetterDir() {
            if (!window.showDirectoryPicker) { alert('Dein Browser unterstützt keinen Verzeichnis-Picker (Chrome/Edge verwenden).'); return; }
            try { blaetterDirHandle = await window.showDirectoryPicker({ mode: 'read' }); updateDirDisplay(); } catch (e) { if (e.name !== 'AbortError') console.warn(e); }
        }
        async function pickCardsExportDir() {
            if (!window.showDirectoryPicker) { alert('Dein Browser unterstützt keinen Verzeichnis-Picker (Chrome/Edge verwenden).'); return; }
            try { cardsExportDirHandle = await window.showDirectoryPicker({ mode: 'read' }); updateDirDisplay(); } catch (e) { if (e.name !== 'AbortError') console.warn(e); }
        }
        async function pickWerkstattDir() {
            if (!window.showDirectoryPicker) { alert('Dein Browser unterstützt keinen Verzeichnis-Picker (Chrome/Edge verwenden).'); return; }
            try { werkstattDirHandle = await window.showDirectoryPicker({ mode: 'read' }); updateDirDisplay(); } catch (e) { if (e.name !== 'AbortError') console.warn(e); }
        }

        window.addEventListener('load', updateDirDisplay);
    </script>
    <script>
        const USER_CONFIG_KEY = 'notentischUserConfig';
        const DEFAULTS = window.NOTENTISCH_USER_CONFIG_DEFAULTS ? { ...window.NOTENTISCH_USER_CONFIG_DEFAULTS } : {};

        function clampNumber(value, min, max, fallback) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fallback;
            return Math.min(max, Math.max(min, parsed));
        }

        function normalizeBoolean(value, fallback) {
            if (typeof value === 'boolean') return value;
            if (value === 'true' || value === '1' || value === 1 || value === 'show') return true;
            if (value === 'false' || value === '0' || value === 0 || value === 'hide') return false;
            return fallback;
        }

        function normalizeHexColor(value, fallback) {
            const input = String(value || '').trim();
            if (/^#[0-9a-fA-F]{6}$/.test(input)) return input.toLowerCase();
            return fallback;
        }

        function normalizePageInfoTone(value) {
            const input = String(value || '').trim().toLowerCase();
            if (input === 'dunkel' || input === 'normal' || input === 'hell') return input;
            return DEFAULTS.pageInfoTone || 'normal';
        }

        function normalizeAudioMatchStrictness(value) {
            const input = String(value || '').trim().toLowerCase();
            if (input === 'locker' || input === 'normal' || input === 'streng') return input;
            return DEFAULTS.audioMatchStrictness || 'normal';
        }

        function normalizeAudioResetOnSilenceMs(value) {
            const parsed = Number(value);
            if (parsed === 800 || parsed === 1000 || parsed === 1500) return parsed;
            const fallback = Number(DEFAULTS.audioResetOnSilenceMs);
            if (fallback === 800 || fallback === 1000 || fallback === 1500) return fallback;
            return 1500;
        }

        function normalizeCardSharpness(value) {
            const input = String(value || '').trim().toLowerCase();
            if (input === 'normal' || input === 'scharf1' || input === 'scharf2') return input;
            return DEFAULTS.cardSharpness || 'normal';
        }

        function normalizePdfBaseDir(value) {
            const input = String(value || '').trim().replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
            if (input === 'Blätter' || input === 'Noten/Blätter' || input === 'Noten') return input;
            return DEFAULTS.pdfBaseDir || 'Blätter';
        }

        function loadConfig() {
            try {
                const raw = localStorage.getItem(USER_CONFIG_KEY);
                if (!raw) return { ...DEFAULTS };
                const parsed = JSON.parse(raw);
                if (typeof window.notentischNormalizeUserConfig === 'function') return window.notentischNormalizeUserConfig(parsed);
                return { ...DEFAULTS, ...parsed };
            } catch {
                return { ...DEFAULTS };
            }
        }

        function saveConfig(config) { localStorage.setItem(USER_CONFIG_KEY, JSON.stringify(config)); }

        function applyToForm(config) {
            document.getElementById('centerDefaultZoom').value = clampNumber(config.centerDefaultZoom, 0.05, 2.0, DEFAULTS.centerDefaultZoom);
            document.getElementById('centerMinZoom').value = clampNumber(config.centerMinZoom, 0.05, 2.0, DEFAULTS.centerMinZoom);
            document.getElementById('centerMaxZoom').value = clampNumber(config.centerMaxZoom, 0.2, 5.0, DEFAULTS.centerMaxZoom);
            document.getElementById('centerZoomDebounceMs').value = clampNumber(config.centerZoomDebounceMs, 20, 600, DEFAULTS.centerZoomDebounceMs);
            document.getElementById('centerZoomHoldEnabled').value = normalizeBoolean(config.centerZoomHoldEnabled, DEFAULTS.centerZoomHoldEnabled) ? 'show' : 'hide';
            document.getElementById('centerZoomHoldDelayMs').value = clampNumber(config.centerZoomHoldDelayMs, 80, 1000, DEFAULTS.centerZoomHoldDelayMs);
            document.getElementById('centerZoomHoldIntervalMs').value = clampNumber(config.centerZoomHoldIntervalMs, 30, 400, DEFAULTS.centerZoomHoldIntervalMs);
            document.getElementById('centerCanvasExtraWidth').value = clampNumber(config.centerCanvasExtraWidth, 0, 40, DEFAULTS.centerCanvasExtraWidth);
            document.getElementById('centerFitMonitorPages').value = clampNumber(config.centerFitMonitorPages, 1, 6, DEFAULTS.centerFitMonitorPages);
            document.getElementById('centerSmoothScroll').value = normalizeBoolean(config.centerSmoothScroll, DEFAULTS.centerSmoothScroll) ? 'show' : 'hide';
            document.getElementById('pageInfoTone').value = normalizePageInfoTone(config.pageInfoTone);
            document.getElementById('autoFullscreenOnStart').value = normalizeBoolean(config.autoFullscreenOnStart, DEFAULTS.autoFullscreenOnStart) ? 'show' : 'hide';
            document.getElementById('dropGlowDurationMs').value = clampNumber(config.dropGlowDurationMs, 0, 10000, DEFAULTS.dropGlowDurationMs);
            document.getElementById('stackBatchOverlapCount').value = clampNumber(config.stackBatchOverlapCount, 0, 9, DEFAULTS.stackBatchOverlapCount ?? 2);
            document.getElementById('audioReferenceTargetMs').value = clampNumber(config.audioReferenceTargetMs, 1500, 12000, DEFAULTS.audioReferenceTargetMs ?? 5000);
            document.getElementById('audioRecordStartDelayMs').value = clampNumber(config.audioRecordStartDelayMs, 0, 3000, DEFAULTS.audioRecordStartDelayMs ?? 0);
            document.getElementById('audioWaitAfterMatchMs').value = clampNumber(config.audioWaitAfterMatchMs, 4000, 8000, DEFAULTS.audioWaitAfterMatchMs ?? 4000);
            document.getElementById('audioResetOnSilenceMs').value = String(normalizeAudioResetOnSilenceMs(config.audioResetOnSilenceMs));
            document.getElementById('audioMatchExceptionalModesEnabled').value = normalizeBoolean(config.audioMatchExceptionalModesEnabled, DEFAULTS.audioMatchExceptionalModesEnabled ?? false) ? 'show' : 'hide';
            document.getElementById('audioMatchStrictness').value = normalizeAudioMatchStrictness(config.audioMatchStrictness);
            document.getElementById('replaceAudioByTitle').value = normalizeBoolean(config.replaceAudioByTitle, DEFAULTS.replaceAudioByTitle ?? true) ? 'show' : 'hide';
            document.getElementById('pdfBaseDir').value = normalizePdfBaseDir(config.pdfBaseDir);
            document.getElementById('cardSharpness').value = normalizeCardSharpness(config.cardSharpness);
            const baseColor = normalizeHexColor(config.btnBaseColor, DEFAULTS.btnBaseColor || '#3498db');
            const toggleColor1 = normalizeHexColor(config.btnToggleColor1, DEFAULTS.btnToggleColor1 || '#27ae60');
            const toggleColor2 = normalizeHexColor(config.btnToggleColor2, DEFAULTS.btnToggleColor2 || '#52be80');

            document.getElementById('btnBaseColorPicker').value = baseColor;
            document.getElementById('btnBaseColorHex').value = baseColor;
            document.getElementById('btnToggleColor1Picker').value = toggleColor1;
            document.getElementById('btnToggleColor1Hex').value = toggleColor1;
            document.getElementById('btnToggleColor2Picker').value = toggleColor2;
            document.getElementById('btnToggleColor2Hex').value = toggleColor2;

            updateColorSwatch('swatchBase', baseColor, '#3498db');
            updateColorSwatch('swatchToggle1', toggleColor1, '#27ae60');
            updateColorSwatch('swatchToggle2', toggleColor2, '#52be80');
        }

        function readFromForm() {
            const existing = loadConfig();
            return {
                ...existing,
                centerZoomFocus: 'left-top',
                centerDefaultZoom: clampNumber(document.getElementById('centerDefaultZoom').value, 0.05, 2.0, DEFAULTS.centerDefaultZoom),
                centerMinZoom: clampNumber(document.getElementById('centerMinZoom').value, 0.05, 2.0, DEFAULTS.centerMinZoom),
                centerMaxZoom: clampNumber(document.getElementById('centerMaxZoom').value, 0.2, 5.0, DEFAULTS.centerMaxZoom),
                centerZoomDebounceMs: clampNumber(document.getElementById('centerZoomDebounceMs').value, 20, 600, DEFAULTS.centerZoomDebounceMs),
                centerZoomHoldEnabled: normalizeBoolean(document.getElementById('centerZoomHoldEnabled').value, DEFAULTS.centerZoomHoldEnabled),
                centerZoomHoldDelayMs: clampNumber(document.getElementById('centerZoomHoldDelayMs').value, 80, 1000, DEFAULTS.centerZoomHoldDelayMs),
                centerZoomHoldIntervalMs: clampNumber(document.getElementById('centerZoomHoldIntervalMs').value, 30, 400, DEFAULTS.centerZoomHoldIntervalMs),
                centerCanvasExtraWidth: clampNumber(document.getElementById('centerCanvasExtraWidth').value, 0, 40, DEFAULTS.centerCanvasExtraWidth),
                centerFitMonitorPages: clampNumber(document.getElementById('centerFitMonitorPages').value, 1, 6, DEFAULTS.centerFitMonitorPages),
                centerSmoothScroll: normalizeBoolean(document.getElementById('centerSmoothScroll').value, DEFAULTS.centerSmoothScroll),
                pageInfoTone: normalizePageInfoTone(document.getElementById('pageInfoTone').value),
                autoFullscreenOnStart: normalizeBoolean(document.getElementById('autoFullscreenOnStart').value, DEFAULTS.autoFullscreenOnStart),
                dropGlowDurationMs: clampNumber(document.getElementById('dropGlowDurationMs').value, 0, 10000, DEFAULTS.dropGlowDurationMs),
                stackBatchOverlapCount: clampNumber(document.getElementById('stackBatchOverlapCount').value, 0, 9, DEFAULTS.stackBatchOverlapCount ?? 2),
                audioReferenceTargetMs: clampNumber(document.getElementById('audioReferenceTargetMs').value, 1500, 12000, DEFAULTS.audioReferenceTargetMs ?? 5000),
                audioRecordStartDelayMs: clampNumber(document.getElementById('audioRecordStartDelayMs').value, 0, 3000, DEFAULTS.audioRecordStartDelayMs ?? 0),
                audioWaitAfterMatchMs: clampNumber(document.getElementById('audioWaitAfterMatchMs').value, 4000, 8000, DEFAULTS.audioWaitAfterMatchMs ?? 4000),
                audioResetOnSilenceMs: normalizeAudioResetOnSilenceMs(document.getElementById('audioResetOnSilenceMs').value),
                audioMatchExceptionalModesEnabled: normalizeBoolean(document.getElementById('audioMatchExceptionalModesEnabled').value, DEFAULTS.audioMatchExceptionalModesEnabled ?? false),
                audioMatchStrictness: normalizeAudioMatchStrictness(document.getElementById('audioMatchStrictness').value),
                replaceAudioByTitle: normalizeBoolean(document.getElementById('replaceAudioByTitle').value, DEFAULTS.replaceAudioByTitle ?? true),
                pdfBaseDir: normalizePdfBaseDir(document.getElementById('pdfBaseDir').value),
                cardSharpness: normalizeCardSharpness(document.getElementById('cardSharpness').value),
                btnBaseColor: normalizeHexColor(document.getElementById('btnBaseColorHex').value, DEFAULTS.btnBaseColor || '#3498db'),
                btnToggleColor1: normalizeHexColor(document.getElementById('btnToggleColor1Hex').value, DEFAULTS.btnToggleColor1 || '#27ae60'),
                btnToggleColor2: normalizeHexColor(document.getElementById('btnToggleColor2Hex').value, DEFAULTS.btnToggleColor2 || '#52be80')
            };
        }

        function saveWithStatus(msg) {
            const cfg = readFromForm();
            saveConfig(cfg);
            applyToForm(cfg);
            document.getElementById('status').textContent = msg;
        }

        function updateColorSwatch(swatchId, hex, fallback) {
            const swatch = document.getElementById(swatchId);
            if (swatch) swatch.style.background = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : fallback;
        }

        function bindColorInputs(pickerId, hexId, swatchId, fallback) {
            const picker = document.getElementById(pickerId);
            const hexInput = document.getElementById(hexId);
            if (!picker || !hexInput) return;

            picker.addEventListener('input', (e) => {
                const hex = e.target.value;
                hexInput.value = hex;
                updateColorSwatch(swatchId, hex, fallback);
                saveWithStatus('Automatisch gespeichert.');
            });

            hexInput.addEventListener('input', (e) => {
                const hex = e.target.value.trim();
                updateColorSwatch(swatchId, hex, fallback);
                if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
                    picker.value = hex.toLowerCase();
                    saveWithStatus('Automatisch gespeichert.');
                }
            });

            hexInput.addEventListener('change', (e) => {
                const hex = normalizeHexColor(e.target.value, fallback);
                e.target.value = hex;
                picker.value = hex;
                updateColorSwatch(swatchId, hex, fallback);
                saveWithStatus('Automatisch gespeichert.');
            });
        }

        bindColorInputs('btnBaseColorPicker', 'btnBaseColorHex', 'swatchBase', DEFAULTS.btnBaseColor || '#3498db');
        bindColorInputs('btnToggleColor1Picker', 'btnToggleColor1Hex', 'swatchToggle1', DEFAULTS.btnToggleColor1 || '#27ae60');
        bindColorInputs('btnToggleColor2Picker', 'btnToggleColor2Hex', 'swatchToggle2', DEFAULTS.btnToggleColor2 || '#52be80');

        ['centerDefaultZoom', 'centerMinZoom', 'centerMaxZoom', 'centerZoomDebounceMs', 'centerZoomHoldEnabled', 'centerZoomHoldDelayMs', 'centerZoomHoldIntervalMs', 'centerCanvasExtraWidth', 'centerFitMonitorPages', 'centerSmoothScroll', 'pageInfoTone', 'autoFullscreenOnStart', 'dropGlowDurationMs', 'stackBatchOverlapCount', 'audioReferenceTargetMs', 'audioRecordStartDelayMs', 'audioWaitAfterMatchMs', 'audioResetOnSilenceMs', 'audioMatchExceptionalModesEnabled', 'audioMatchStrictness', 'replaceAudioByTitle', 'pdfBaseDir', 'cardSharpness'].forEach((id) => {
            const el = document.getElementById(id);
            el.addEventListener('input', () => {
                saveWithStatus('Automatisch gespeichert.');
                if (id === 'centerCanvasExtraWidth') {
                    const value = clampNumber(el.value, 0, 40, DEFAULTS.centerCanvasExtraWidth);
                    document.documentElement.style.setProperty('--center-gap', value + 'px');
                }
            });
            el.addEventListener('change', () => {
                saveWithStatus('Automatisch gespeichert.');
                if (id === 'centerCanvasExtraWidth') {
                    const value = clampNumber(el.value, 0, 40, DEFAULTS.centerCanvasExtraWidth);
                    document.documentElement.style.setProperty('--center-gap', value + 'px');
                }
            });
        });

        document.getElementById('saveBtn').addEventListener('click', () => saveWithStatus('Gespeichert.'));
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.replace('config.html?v=20260510f');
        });

        applyToForm(loadConfig());
        const cfg = loadConfig();
        document.documentElement.style.setProperty('--center-gap', cfg.centerCanvasExtraWidth + 'px');
    </script>
</body>
</html>
