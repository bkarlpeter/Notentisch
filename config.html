<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notentisch Config</title>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 24px; box-sizing: border-box; }
        .card { width: min(760px, 100%); background: #1b1b1b; border: 1px solid #2f2f2f; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 20px; margin: 0 0 10px; }
        .hint { color: #a9a9a9; font-size: 13px; margin: 0 0 16px; }
        .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 760px) { .settings-grid { grid-template-columns: 1fr; } }
        .field { border: 1px solid #2f2f2f; border-radius: 8px; padding: 10px; background: #171717; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; }
        input[type="number"], select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #3a3a3a; background: #111; color: #fff; }
        input[type="color"] { width: 56px; height: 40px; border-radius: 6px; border: 1px solid #3a3a3a; background: #111; padding: 2px; }
        .field-preview { grid-column: span 2; }
        @media (max-width: 760px) { .field-preview { grid-column: span 1; } }
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 140px auto;
            grid-template-rows: auto auto;
            gap: 8px 10px;
            align-items: center;
        }
        .preview-name { font-weight: 600; }
        .preview-value { width: 100%; box-sizing: border-box; }
        .preview-image-wrap {
            grid-column: 3;
            grid-row: 1 / span 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #musicPreview { width: 4cm; height: 4cm; border-radius: 8px; border: 1px solid #3a3a3a; background: #222; display: block; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        button { padding: 10px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; background: #3498db; color: #fff; }
        button.secondary { background: #3a3a3a; }
        #status { margin-top: 12px; font-size: 13px; color: #a9d8ff; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Notentisch Einstellungen</h1>
        <p class="hint">Standardwerte für Board und Center; erweiterte Zoom-Parameter findest du unter "Advanced".</p>

        <div class="settings-grid">
            <div class="field field-preview">
                <div class="preview-grid">
                    <label class="preview-name" for="pdfSharpness">PDF-Schärfe Faktor</label>
                    <input id="pdfSharpness" class="preview-value" type="number" min="0.8" max="2.5" step="0.1">
                    <div class="preview-image-wrap">
                        <canvas id="musicPreview" width="160" height="160" aria-label="Noten Vorschau"></canvas>
                    </div>

                    <label class="preview-name" for="paperTintPercent">Papierstärke in % (0 - 25)</label>
                    <input id="paperTintPercent" class="preview-value" type="number" min="0" max="25" step="0.5">
                </div>
            </div>

            <div class="field">
                <label for="tintMethod">Färbe-Methode</label>
                <select id="tintMethod">
                    <option value="paper-only">Blatt leicht</option>
                    <option value="paper-strong">Blatt stark</option>
                </select>
            </div>

            <div class="field">
                <label for="tintStrength">Blatt-Tönung Stärke (0.5 - 2.0)</label>
                <input id="tintStrength" type="number" min="0.5" max="2.0" step="0.1">
            </div>

            <div class="field">
                <label for="paperTintColor">Papierfarbe</label>
                <input id="paperTintColor" type="color">
            </div>

            <div class="field">
                <label for="showFullscreenButton">Vollbild-Button im Board</label>
                <select id="showFullscreenButton">
                    <option value="show">Anzeigen</option>
                    <option value="hide">Ausblenden</option>
                </select>
            </div>

            <div class="field">
                <label for="centerAlignBtn">Ausrichtung im Center (bei Drop)</label>
                <button id="centerAlignBtn" type="button" class="secondary">Links</button>
            </div>

            <div class="field">
                <label for="useZoomSettingsOnDrop">Benutze Zoom-Settings beim Drop</label>
                <select id="useZoomSettingsOnDrop">
                    <option value="show">Ja</option>
                    <option value="hide">Nein</option>
                </select>
            </div>

            <div class="field">
                <label for="zoomStep">Zoom-Stufe (0.02 - 0.5)</label>
                <input id="zoomStep" type="number" min="0.02" max="0.5" step="0.01">
            </div>

            <div class="field">
                <label for="scrollStep">Scroll-Schritt in Pixel (60 - 800)</label>
                <input id="scrollStep" type="number" min="60" max="800" step="10">
            </div>
        </div>

        <div class="actions">
            <button id="saveBtn" type="button">Speichern</button>
            <button id="resetBtn" type="button" class="secondary">Zurücksetzen</button>
            <button id="advancedBtn" type="button" class="secondary">Advanced</button>
            <button id="backToBoardBtn" type="button" class="secondary">Zurück zum Board</button>
        </div>
        <div id="status"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script src="center-config.js?v=20260308"></script>
    <script>
        const USER_CONFIG_KEY = 'notentischUserConfig';
        const DEFAULTS = window.NOTENTISCH_USER_CONFIG_DEFAULTS ? { ...window.NOTENTISCH_USER_CONFIG_DEFAULTS } : {};
        const PREVIEW_CACHE_IMAGE_KEY = 'notentischConfigPreviewPng';
        const PREVIEW_CACHE_PDF_KEY = 'notentischConfigPreviewPdfPath';
        const PREVIEW_XML_CANDIDATES = ['Notentisch.xml', 'notentisch.xml'];
        const PREVIEW_IMAGE_CANDIDATES = ['Cards_Export/test.png', 'Cards_Export/card_Alpenecho.png'];
        const PREVIEW_PDF_DIR_CANDIDATES = ['Blätter/', 'Noten/Blätter/', 'Noten/'];
        const PREVIEW_IMG_DIR_CANDIDATES = ['Cards_Export/'];
        const PREVIEW_OFFSET_CM = 5;
        const PREVIEW_CROP_CM = 7;

        let previewBaseImageElement = null;
        let previewFallbackImageElement = null;
        let previewLoadPromise = null;
        let previewFallbackLoadStarted = false;

        function clampNumber(value, min, max, fallback) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fallback;
            return Math.min(max, Math.max(min, parsed));
        }

        function normalizeHexColor(value, fallback) {
            const input = String(value || '').trim();
            if (/^#[0-9a-fA-F]{6}$/.test(input)) return input.toLowerCase();
            return fallback;
        }

        function normalizeTintMethod(value) {
            const input = String(value || '').trim();
            if (input === 'paper-only' || input === 'paper-strong') return input;
            return DEFAULTS.tintMethod;
        }

        function normalizeTintStrength(value) {
            return clampNumber(value, 0.5, 2.0, DEFAULTS.tintStrength);
        }

        function normalizeZoomStep(value) {
            return clampNumber(value, 0.02, 0.5, DEFAULTS.zoomStep);
        }

        function normalizeScrollStep(value) {
            return clampNumber(value, 60, 800, DEFAULTS.scrollStep);
        }

        function normalizeCenterAlign(value) {
            const input = String(value || '').trim().toLowerCase();
            if (input === 'left' || input === 'right' || input === 'middle') return input;
            return DEFAULTS.centerAlign;
        }

        function normalizeBoolean(value, fallback) {
            if (typeof value === 'boolean') return value;
            if (value === 'true' || value === '1' || value === 1 || value === 'show') return true;
            if (value === 'false' || value === '0' || value === 0 || value === 'hide') return false;
            return fallback;
        }

        function loadConfig() {
            try {
                const raw = localStorage.getItem(USER_CONFIG_KEY);
                if (!raw) return { ...DEFAULTS };
                const parsed = JSON.parse(raw);
                if (typeof window.notentischNormalizeUserConfig === 'function') {
                    return window.notentischNormalizeUserConfig(parsed);
                }
                return { ...DEFAULTS, ...parsed };
            } catch {
                return { ...DEFAULTS };
            }
        }

        function saveConfig(config) {
            localStorage.setItem(USER_CONFIG_KEY, JSON.stringify(config));
        }

        function applyToForm(config) {
            document.getElementById('pdfSharpness').value = clampNumber(config.pdfSharpness, 0.8, 2.5, DEFAULTS.pdfSharpness);
            document.getElementById('paperTintPercent').value = clampNumber(config.paperTintPercent, 0, 25, DEFAULTS.paperTintPercent);
            document.getElementById('paperTintColor').value = normalizeHexColor(config.paperTintColor, DEFAULTS.paperTintColor);
            document.getElementById('tintMethod').value = normalizeTintMethod(config.tintMethod);
            document.getElementById('tintStrength').value = normalizeTintStrength(config.tintStrength);
            document.getElementById('zoomStep').value = normalizeZoomStep(config.zoomStep);
            document.getElementById('scrollStep').value = normalizeScrollStep(config.scrollStep);
            document.getElementById('showFullscreenButton').value = normalizeBoolean(config.showFullscreenButton, DEFAULTS.showFullscreenButton) ? 'show' : 'hide';
            document.getElementById('useZoomSettingsOnDrop').value = normalizeBoolean(config.useZoomSettingsOnDrop, DEFAULTS.useZoomSettingsOnDrop) ? 'show' : 'hide';
            const alignBtn = document.getElementById('centerAlignBtn');
            const alignValue = normalizeCenterAlign(config.centerAlign);
            alignBtn.dataset.value = alignValue;
            alignBtn.textContent = alignValue === 'right' ? 'Rechts' : (alignValue === 'middle' ? 'Mitte' : 'Links');
            drawMusicPreview(config);
        }

        function readFromForm() {
            const existing = loadConfig();
            return {
                ...existing,
                pdfSharpness: clampNumber(document.getElementById('pdfSharpness').value, 0.8, 2.5, DEFAULTS.pdfSharpness),
                paperTintPercent: clampNumber(document.getElementById('paperTintPercent').value, 0, 25, DEFAULTS.paperTintPercent),
                paperTintColor: normalizeHexColor(document.getElementById('paperTintColor').value, DEFAULTS.paperTintColor),
                tintMethod: normalizeTintMethod(document.getElementById('tintMethod').value),
                tintStrength: normalizeTintStrength(document.getElementById('tintStrength').value),
                zoomStep: normalizeZoomStep(document.getElementById('zoomStep').value),
                scrollStep: normalizeScrollStep(document.getElementById('scrollStep').value),
                showFullscreenButton: normalizeBoolean(document.getElementById('showFullscreenButton').value, DEFAULTS.showFullscreenButton),
                useZoomSettingsOnDrop: normalizeBoolean(document.getElementById('useZoomSettingsOnDrop').value, DEFAULTS.useZoomSettingsOnDrop),
                centerAlign: normalizeCenterAlign((document.getElementById('centerAlignBtn')?.dataset.value) || existing.centerAlign)
            };
        }

        function hexToRgb(hexColor) {
            const hex = normalizeHexColor(hexColor, DEFAULTS.paperTintColor).slice(1);
            return { r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16) };
        }

        function getTintOpacityFromPercent(percent) {
            const normalized = clampNumber(percent / 25, 0, 1, DEFAULTS.paperTintPercent / 25);
            return clampNumber(normalized * 0.6, 0, 0.6, 0.08);
        }

        function getEffectiveTintOpacity(percent, strength) {
            const baseOpacity = getTintOpacityFromPercent(percent);
            return clampNumber(baseOpacity * normalizeTintStrength(strength), 0, 0.85, 0.08);
        }

        function getTintProfile(method) {
            switch (method) {
                case 'paper-strong':
                    return { minLum: 140, maxSat: 95, lumSpan: 110 };
                case 'paper-only':
                default:
                    return { minLum: 155, maxSat: 72, lumSpan: 100 };
            }
        }

        function cmToPt(cm) {
            return (cm * 72) / 2.54;
        }

        function encodePath(pathValue) {
            if (!pathValue) return '';
            const safeDecode = (segment) => {
                try { return decodeURIComponent(segment); } catch { return segment; }
            };
            return String(pathValue)
                .split('/')
                .filter(part => part !== '')
                .map(part => encodeURIComponent(safeDecode(part)))
                .join('/');
        }

        function normalizePdfPath(inputPath) {
            const raw = String(inputPath || '').trim();
            if (!raw) return '';
            const hashParts = raw.split('#').map(p => p.trim()).filter(Boolean);
            const pdfParts = hashParts.filter(p => p.toLowerCase().includes('.pdf'));

            let actualPath = raw;
            if (pdfParts.length) {
                const relativeCandidate = pdfParts.find(p => !/^[a-zA-Z]:[\\/]/.test(p));
                actualPath = relativeCandidate || pdfParts[0];
            }

            return actualPath
                .replace(/\\/g, '/')
                .replace(/^\.\.\//g, '')
                .replace(/^\.\//g, '');
        }

        function getPdfPathCandidates(inputPath) {
            const normalizedActual = normalizePdfPath(inputPath);
            const fileName = (normalizedActual.split('/').pop() || '').trim();
            const candidates = [normalizedActual];
            if (fileName) {
                candidates.push('Blätter/' + fileName, 'Noten/Blätter/' + fileName, 'Noten/' + fileName);
            }
            return [...new Set(candidates.filter(Boolean))];
        }

        function getPreviewCache() {
            return {
                png: localStorage.getItem(PREVIEW_CACHE_IMAGE_KEY) || '',
                pdfPath: localStorage.getItem(PREVIEW_CACHE_PDF_KEY) || ''
            };
        }

        function setPreviewCache(pngDataUrl, pdfPath) {
            try {
                localStorage.setItem(PREVIEW_CACHE_IMAGE_KEY, pngDataUrl || '');
                localStorage.setItem(PREVIEW_CACHE_PDF_KEY, pdfPath || '');
            } catch {
            }
        }

        async function listDirectoryFiles(directoryPath, filePattern) {
            try {
                const response = await fetch(directoryPath, { cache: 'no-store' });
                if (!response.ok) return [];
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a[href]'));
                const results = [];
                for (const link of links) {
                    const href = decodeURIComponent(link.getAttribute('href') || '');
                    if (!href || href.endsWith('/')) continue;
                    const name = href.split('/').pop() || href;
                    if (filePattern.test(name)) {
                        results.push(directoryPath + href.replace(/^\.\//, ''));
                    }
                }
                return results;
            } catch {
                return [];
            }
        }

        function loadImage(source) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = source;
            });
        }

        async function resolveFirstPdfPathFromXml() {
            for (const xmlPath of PREVIEW_XML_CANDIDATES) {
                try {
                    const response = await fetch(xmlPath, { cache: 'no-store' });
                    if (!response.ok) continue;
                    const xmlText = await response.text();
                    const xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
                    const cardNodes = xmlDoc.querySelectorAll('NotenTisch, Notentisch');
                    for (const node of cardNodes) {
                        const pathText = (node.querySelector('Speicherort')?.textContent || '').trim();
                        if (pathText && pathText.toLowerCase().includes('.pdf')) return pathText;
                    }
                } catch {
                }
            }
            return '';
        }

        async function resolveFirstPdfPathFromDirectories() {
            for (const directoryPath of PREVIEW_PDF_DIR_CANDIDATES) {
                const candidates = await listDirectoryFiles(directoryPath, /\.pdf$/i);
                if (candidates.length > 0) return candidates[0];
            }
            return '';
        }

        async function renderPreviewPngFromPdfPath(rawPdfPath) {
            if (!window.pdfjsLib) return null;
            const candidates = getPdfPathCandidates(rawPdfPath);

            for (const candidate of candidates) {
                try {
                    const serverPath = encodePath(candidate);
                    const pdfDoc = await pdfjsLib.getDocument(serverPath).promise;
                    const page = await pdfDoc.getPage(1);
                    const renderScale = 2.0;
                    const viewport = page.getViewport({ scale: renderScale });

                    const sourceCanvas = document.createElement('canvas');
                    sourceCanvas.width = Math.max(1, Math.floor(viewport.width));
                    sourceCanvas.height = Math.max(1, Math.floor(viewport.height));
                    const sourceCtx = sourceCanvas.getContext('2d');

                    await page.render({ canvasContext: sourceCtx, viewport }).promise;

                    const leftPt = cmToPt(PREVIEW_OFFSET_CM);
                    const topPt = cmToPt(PREVIEW_OFFSET_CM);
                    const cropPt = cmToPt(PREVIEW_CROP_CM);
                    const leftPx = Math.max(0, Math.floor(leftPt * renderScale));
                    const topPx = Math.max(0, Math.floor(topPt * renderScale));
                    const cropPx = Math.max(16, Math.floor(cropPt * renderScale));
                    const srcW = Math.max(1, Math.min(cropPx, sourceCanvas.width - leftPx));
                    const srcH = Math.max(1, Math.min(cropPx, sourceCanvas.height - topPx));

                    if (srcW < 8 || srcH < 8) continue;

                    const targetCanvas = document.createElement('canvas');
                    targetCanvas.width = 320;
                    targetCanvas.height = 320;
                    const targetCtx = targetCanvas.getContext('2d');
                    targetCtx.drawImage(sourceCanvas, leftPx, topPx, srcW, srcH, 0, 0, targetCanvas.width, targetCanvas.height);

                    const pngDataUrl = targetCanvas.toDataURL('image/png');
                    return { pngDataUrl, resolvedPdfPath: candidate };
                } catch {
                }
            }

            return null;
        }

        async function ensurePreviewBaseImageLoaded() {
            if (previewBaseImageElement) return;
            if (previewLoadPromise) {
                await previewLoadPromise;
                return;
            }

            previewLoadPromise = (async () => {
                const cached = getPreviewCache();
                if (cached.png) {
                    try {
                        previewBaseImageElement = await loadImage(cached.png);
                        return;
                    } catch {
                    }
                }

                const firstPdf = await resolveFirstPdfPathFromXml();
                const pdfSource = firstPdf || await resolveFirstPdfPathFromDirectories();
                if (!pdfSource) return;

                const rendered = await renderPreviewPngFromPdfPath(pdfSource);
                if (!rendered || !rendered.pngDataUrl) return;

                try {
                    previewBaseImageElement = await loadImage(rendered.pngDataUrl);
                    setPreviewCache(rendered.pngDataUrl, rendered.resolvedPdfPath || pdfSource);
                } catch {
                }
            })();

            await previewLoadPromise;
        }

        function ensureFallbackPreviewImageLoaded() {
            if (previewFallbackImageElement || previewFallbackLoadStarted) return;
            previewFallbackLoadStarted = true;

            const cacheFallbackImage = async (img, sourcePath) => {
                try {
                    const srcW = Math.max(1, Math.floor(img.width * 0.42));
                    const srcH = Math.max(1, Math.floor(img.height * 0.30));
                    const srcX = Math.max(0, Math.min(img.width - srcW, Math.floor(img.width * 0.28)));
                    const srcY = Math.max(0, Math.min(img.height - srcH, Math.floor(img.height * 0.30)));

                    const targetCanvas = document.createElement('canvas');
                    targetCanvas.width = 320;
                    targetCanvas.height = 320;
                    const targetCtx = targetCanvas.getContext('2d');
                    targetCtx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, targetCanvas.width, targetCanvas.height);

                    const pngDataUrl = targetCanvas.toDataURL('image/png');
                    setPreviewCache(pngDataUrl, 'fallback:' + (sourcePath || ''));
                } catch {
                }
            };

            (async () => {
                const dynamicCandidates = [];
                for (const directoryPath of PREVIEW_IMG_DIR_CANDIDATES) {
                    const list = await listDirectoryFiles(directoryPath, /\.(png|jpg|jpeg|webp)$/i);
                    dynamicCandidates.push(...list);
                }

                const allCandidates = [...PREVIEW_IMAGE_CANDIDATES, ...dynamicCandidates];
                for (const src of allCandidates) {
                    try {
                        const img = await loadImage(src);
                        previewFallbackImageElement = img;
                        await cacheFallbackImage(img, src);
                        drawMusicPreview(readFromForm());
                        return;
                    } catch {
                    }
                }
            })();
        }

        function applyTintToCanvas(ctx, width, height, config) {
            const tint = hexToRgb(config.paperTintColor);
            const opacity = getEffectiveTintOpacity(config.paperTintPercent, config.tintStrength);
            if (opacity <= 0) return;

            const profile = getTintProfile(config.tintMethod);
            try {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                const imageData = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
                const pixels = imageData.data;

                for (let i = 0; i < pixels.length; i += 4) {
                    const alpha = pixels[i + 3];
                    if (alpha === 0) continue;

                    const red = pixels[i];
                    const green = pixels[i + 1];
                    const blue = pixels[i + 2];

                    const maxChannel = Math.max(red, green, blue);
                    const minChannel = Math.min(red, green, blue);
                    const saturation = maxChannel - minChannel;
                    const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;

                    if (luminance < profile.minLum || saturation > profile.maxSat) continue;

                    const paperStrength = clampNumber((luminance - profile.minLum) / profile.lumSpan, 0, 1, 0);
                    const blend = opacity * paperStrength;
                    if (blend <= 0) continue;

                    pixels[i] = Math.round((red * (1 - blend)) + (tint.r * blend));
                    pixels[i + 1] = Math.round((green * (1 - blend)) + (tint.g * blend));
                    pixels[i + 2] = Math.round((blue * (1 - blend)) + (tint.b * blend));
                }

                ctx.putImageData(imageData, 0, 0);
                ctx.restore();
            } catch {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = 'rgba(' + tint.r + ', ' + tint.g + ', ' + tint.b + ', ' + opacity + ')';
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.restore();
            }
        }

        function drawMusicPreview(config) {
            const canvas = document.getElementById('musicPreview');
            if (!canvas) return;
            const cssWidth = canvas.clientWidth || 160;
            const cssHeight = canvas.clientHeight || 160;
            const outputScale = Math.max(1, (window.devicePixelRatio || 1) * config.pdfSharpness);
            canvas.width = Math.floor(cssWidth * outputScale);
            canvas.height = Math.floor(cssHeight * outputScale);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
            ctx.clearRect(0, 0, cssWidth, cssHeight);

            if (previewBaseImageElement) {
                ctx.drawImage(previewBaseImageElement, 0, 0, cssWidth, cssHeight);
                applyTintToCanvas(ctx, cssWidth, cssHeight, config);
                return;
            }

            if (previewFallbackImageElement) {
                const img = previewFallbackImageElement;
                const srcW = Math.max(1, Math.floor(img.width * 0.42));
                const srcH = Math.max(1, Math.floor(img.height * 0.30));
                const srcX = Math.max(0, Math.min(img.width - srcW, Math.floor(img.width * 0.28)));
                const srcY = Math.max(0, Math.min(img.height - srcH, Math.floor(img.height * 0.30)));
                ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, cssWidth, cssHeight);
                applyTintToCanvas(ctx, cssWidth, cssHeight, config);
                return;
            }

            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, cssWidth, cssHeight);

            ensureFallbackPreviewImageLoaded();
            ensurePreviewBaseImageLoaded().then(() => {
                drawMusicPreview(readFromForm());
            });
        }

        function saveFromFormWithStatus(message) {
            const cfg = readFromForm();
            applyToForm(cfg);
            saveConfig(cfg);
            document.getElementById('status').textContent = message;
        }

        document.getElementById('centerAlignBtn').addEventListener('click', () => {
            const btn = document.getElementById('centerAlignBtn');
            const current = normalizeCenterAlign(btn.dataset.value);
            const next = current === 'left' ? 'middle' : (current === 'middle' ? 'right' : 'left');
            btn.dataset.value = next;
            btn.textContent = next === 'right' ? 'Rechts' : (next === 'middle' ? 'Mitte' : 'Links');
            saveFromFormWithStatus('Automatisch gespeichert.');
        });

        ['pdfSharpness', 'paperTintPercent', 'paperTintColor', 'tintMethod', 'tintStrength', 'zoomStep', 'scrollStep', 'showFullscreenButton', 'useZoomSettingsOnDrop'].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', () => saveFromFormWithStatus('Automatisch gespeichert.'));
            el.addEventListener('change', () => saveFromFormWithStatus('Automatisch gespeichert.'));
        });

        document.getElementById('saveBtn').addEventListener('click', () => saveFromFormWithStatus('Gespeichert.'));
        document.getElementById('resetBtn').addEventListener('click', () => {
            const cfg = { ...DEFAULTS };
            applyToForm(cfg);
            saveConfig(cfg);
            document.getElementById('status').textContent = 'Auf Standard zurückgesetzt.';
        });
        document.getElementById('advancedBtn').addEventListener('click', () => { window.location.href = 'advanced_config.html'; });
        document.getElementById('backToBoardBtn').addEventListener('click', () => {
            window.location.href = 'board.html';
        });

        window.addEventListener('resize', () => drawMusicPreview(readFromForm()));
        applyToForm(loadConfig());
    </script>
</body>
</html>
