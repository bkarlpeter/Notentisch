name: Bug report
description: Melde einen Fehler im aktuellen Verhalten
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke fuer den Report. Bitte so konkret wie moeglich ausfuellen.

  - type: input
    id: summary
    attributes:
      label: Kurzbeschreibung
      placeholder: Was funktioniert nicht wie erwartet?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Tatsaechliches Verhalten
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Umgebung
      placeholder: z. B. Windows 11, Browser, Projektversion

  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      render: shell
